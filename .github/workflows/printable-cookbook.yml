# Rebuilds the printable PDF cookbook whenever the book changes on main,
# so the download link on the website always matches the recipes.
name: Rebuild printable cookbook

on:
  push:
    branches: [main]
    paths: ["index.html", "print/**", "!print/*.pdf"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: printable-cookbook
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: print
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build PDFs
        working-directory: print
        run: npm run build
      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print/*.pdf
          git diff --cached --quiet && echo "PDFs already up to date" && exit 0
          git commit -m "Rebuild printable cookbook PDF"
          git push
