# Pressure Cooker Carnitas Tacos
### Pork shoulder pressure-cooked until tender, then broiled in its own fat until the edges crackle

**Serves:** 6–8 (about 16 tacos) | **Active:** 25 min | **Total:** ~1 hr 30 min (add a day if you dry-brine) | **Keeps:** 4 days refrigerated, 3 months frozen
**Equipment:** Pressure cooker, rimmed sheet pan (or 12-inch cast iron), fat separator or spoon, two forks, oven with a broiler
**Inspired by:** Isabel Eats' pressure cooker carnitas, reworked with the book's salt rule and a defatting step

## Game Plan

| When | What |
|---|---|
| Day before (optional) | Cut the pork, salt and rub it. Fridge, uncovered |
| 1 hr 30 min before | Cut pork, rub, load the cooker |
| 40 min under pressure + 15 min natural release | Make pickled onions and salsa while you wait |
| 20 min before eating | Shred, defat the juices, broil |
| Serve | Warm tortillas, build |

## Ingredients

**Pork**

- 3 lb boneless pork shoulder (Boston butt), cut into 3–4 inch chunks, fat left on

**Dry brine + rub**

- 1 Tbsp Morton kosher salt — about 1% of the pork's weight
- 2 tsp ground cumin
- 2 tsp dried oregano (Mexican oregano if you have it)
- 2 tsp chili powder
- 1 tsp garlic powder
- 1 tsp onion powder
- ½ tsp coarse black pepper

**Cooking liquid**

- ½ cup chicken stock
- ½ cup orange juice
- 1 bay leaf (optional)

**Finish**

- 2 limes: zest of 1, juice of both
- ⅓ cup cilantro, chopped
- Pinch of flake salt, only if needed

**To build**

- 16 corn or flour tortillas (6 inch)
- [Quick-Pickled Red Onions](#r/quick-pickled-red-onions)
- Avocado-Tomatillo Salsa Verde and/or [Chipotle-Lime Crema](#r/chipotle-lime-crema)
- Queso fresco, crumbled; cilantro sprigs; lime wedges

## Steps

### 1. Cut and season

1. **Cut into big chunks,** 3–4 inches. Large pieces stay juicy; small ones turn to mush under pressure. Don't trim the fat — it's the frying fat later.
2. **Weigh and salt.** Weigh the pork. Use 1 tsp Morton per pound. Mix the salt and every spice in the rub.
3. **Coat.** Rub into every surface. If you have the time, set on a rack, uncovered, in the fridge overnight — a dry brine seasons through to the center. If not, rub and cook right away.

### 2. Pressure cook

1. Pour the stock and orange juice into the cooker. Add the bay leaf.
2. Nestle the pork in, fat side up, in a snug layer. Pork should sit above the liquid, not drown in it.
3. **High pressure, 40 minutes.**
4. **Natural release 15 minutes,** then quick-release whatever pressure is left. A natural release keeps the muscle fibers from seizing and squeezing out juice.

### 3. Shred and defat

1. Lift the chunks onto a sheet pan, leaving the liquid in the cooker. Remove bay leaf and any big pieces of fat or gristle.
2. Let the pork cool 5 minutes, then shred with two forks into bite-size pieces — some ragged, some chunky. The ragged edges crisp best.
3. **Skim the liquid.** Pour the cooker juices into a fat separator (or let stand 5 minutes and spoon the fat off the top). Keep both the fat and the juices.

### 4. Crisp

1. Heat the broiler on high, with the rack 5–6 inches from the element.
2. Spread the pork on the sheet pan in a thin, even layer. Spoon over ⅓ cup of the defatted juices and 2 Tbsp of the skimmed fat.
3. **Broil 5 minutes,** stir, and broil **5 minutes more** until the edges are browned and crisp and the middle stays juicy. Watch it from minute 4 — the orange juice sugar browns fast.
4. **Cast iron option:** Fry the shredded pork in 2 Tbsp of the skimmed fat over medium-high heat in batches, pressing down and not stirring for 2 minutes at a time, until browned on one side.

### 5. Finish

Off the heat, toss with the lime zest, lime juice, and cilantro. Taste. Add a pinch of flake salt only if it needs it. Splash a few more spoonfuls of the defatted juices over if it looks dry.

### 6. Build

Warm the tortillas (flour: dry hot skillet, 20–30 seconds per side; corn: over a flame or in a dry skillet, 10–15 seconds per side). Tortilla → carnitas → pickled onions → salsa verde or crema → queso fresco → cilantro → lime squeeze.

## Why This Works (Five Pillars)

**Salt.** 1% by weight, worked in ahead of time, seasons the pork all the way through. A last-minute pinch of flake salt is for the crisp edges, not the center.

**Fat.** Pork shoulder is marbled and has a fat cap, so it becomes tender under pressure. The fat is skimmed and returned *on purpose*: a spoonful over the pan gives you crisp edges instead of dry ones. That is the real carnitas trick — braise, then fry in the pork's own fat.

**Acid.** Orange juice in the pot flavors the meat. Lime goes on last, off the heat, so it stays fresh and sharp. Pickled onions add a third layer of acid at the table.

**Sweet.** Orange juice brings a little sugar that browns at the broiler. This is one of the few times we want sugar near high heat — and only for 10 minutes, with a watchful eye.

**Umami.** Cumin, oregano, and chili build a savory backbone. Broiling browns the surface (Maillard reaction) so the shreds taste roasted, not just boiled.

**Heat (temperature).** Pressure does in 40 minutes what an oven needs 3 hours for, melting the collagen into gelatin. Then dry, high heat is the second act: moist cooking makes it tender, dry cooking makes it crisp. You need both.

## Variants

- **Smoked first:** Smoke the rubbed chunks on the pellet smoker at 225°F for 1 hour, then pressure cook as above. Add 10 minutes of cooking time.
- **Slow cooker:** Same rub and liquid, low 8–9 hours. Shred and broil the same way.
- **Pantry shortcut:** Replace the rub with 3 Tbsp Kinder's Chipotle Pineapple Seasoning (skip the added salt; it's in the blend).
- **Carnitas bowls:** Over rice with beans, pickled onions, and the [Avocado-Tomatillo Salsa Verde](#r/avocado-tomatillo-salsa-verde).
- **Leftovers:** Stuff into quesadillas, crisp in a skillet with an egg for breakfast tacos, or stir into the Loaded Packet Ramen.

## Troubleshooting

| Problem | Fix |
|---|---|
| Meat dry | Too little fat added back at the broil. Add juices and skimmed fat |
| Meat won't shred | Not enough pressure time. Reseal and cook 8–10 more minutes |
| Not crisp | Layer too thick, or pan overcrowded. Spread thin; broil in two pans if needed |
| Burned edges | Rack too close or orange juice sugar. Move the rack down; stir sooner |
| "Burn" warning on the cooker | Not enough liquid, or spices stuck to the bottom. Keep the liquid at ½ cup minimum, pork on top, spices on the meat |
| Too salty | The juices concentrate. Use fewer juices at the broil and add extra lime |
| Soggy tortillas | Keep them in a towel; drain the carnitas of excess juice before building |

## Salt, Fat, Acid, Heat Tips

- **Wet heat makes it tender; dry heat makes it crisp.** Great braised dishes finish with a second, drier cooking step.
- **Fat you removed can come back with a purpose.** Skim it for control, then add it back where you want browning.
- **Acid last.** Lime added at the end stays bright. Cooked acid goes dull.

## Notes for the Kids

- Big chunks. They look wrong, but they cook up juicy.
- Let the pressure come down slowly. Rushing it makes tough meat.
- Don't skip the broil. It's the part that makes it carnitas.
- Skim the fat, but put a little back. That's how you get crispy edges.
- Makes a lot. Freeze half in a bag with a spoon of juices.

# Smoked Pork Butt Sandwiches
### with Carolina Mustard Sauce, Jalapeño Crema Slaw & Quick-Pickled Onions

**Serves:** 12–16 sandwiches | **Active:** ~1.5 hrs | **Total:** 20–26 hrs (plan a day ahead)
**Equipment:** Pellet smoker, oven, cooler, instant-read + leave-in probe thermometer, butcher string, pink butcher paper, heavy foil, aluminum half-pan, 4–6 old towels

## Game Plan (timeline)

| When | What |
|---|---|
| Day before, morning | Trim, tie, salt + rub. Fridge uncovered 12–24 hrs |
| Day before, evening | Make pickled onions, mustard sauce, crema |
| Cook day, early (≈ 3–4 AM for dinner) | Smoker on at 200°F, pork in |
| Pork hits 160°F (≈ 9–11 hrs) | Baste, wrap in butcher paper, into 210°F oven |
| Pork hits 190°F (≈ 2–4 hrs) | Foil, pan, towel, cooler — carryover finishes it |
| 1 hr before eating | Salt cabbage, build slaw |
| Serving | Shred, sauce, assemble |

Cook times are guides. Temperature and feel decide when it's done, not the clock.

## 1. The Pork

### Ingredients

**Meat**
- 1 pork butt (Boston butt), bone-in or boneless, ~8 lb

**Dry brine + rub**
- 2½ Tbsp Morton kosher salt — about 1% of meat weight
- ¼ cup dark brown sugar, packed
- 3 Tbsp sweet paprika
- 1½ Tbsp smoked paprika
- 1 Tbsp coarse black pepper
- 1 Tbsp granulated garlic
- 2 tsp onion powder
- 2 tsp dry mustard
- ½ tsp cayenne

**Vinegar-sugar baste**
- 1 cup apple cider vinegar
- 2 Tbsp dark brown sugar
- 1 tsp kosher salt
- 1 tsp red pepper flakes

**Pellets:** Competition blend (typically hickory, maple, and cherry).

### Steps

1. **Trim and dry.** Pat dry all over with paper towels. Trim the fat cap to ¼ inch. Remove hard fat and silverskin. Leave the soft interior fat — it renders and keeps the meat moist.
2. **Weigh and salt.** Weigh the trimmed butt. If it isn't 8 lb, scale the salt: 1 tsp Morton per pound.
3. **Tie.** Run butcher string around the butt every 1½–2 inches with a snug knot. You want a compact, even shape that cooks evenly — not a tourniquet.
4. **Dry brine + rub.** Mix salt and rub spices. Coat every surface, pressing it in. Set on a rack over a sheet pan, uncovered, in the fridge 12–24 hours.
5. **Make the baste.** Warm vinegar, sugar, salt, and pepper flakes until dissolved. Cool. Put about half in a spray bottle; keep the rest for wrapping.
6. **Smoke.** Fill the hopper (8+ hours of pellets — top off before bed if running overnight). Bring the pellet smoker to 200°F; low temps give the most smoke on a pellet grill. If yours has a "Super Smoke" mode, use it for the first 3–4 hours. Pork in fat-side up, leave-in probe in the thickest part, away from the bone. Don't open the lid for the first 3 hours.
7. **Spritz.** After 3 hours, spritz every 60–90 minutes when the surface looks dry. Expect the **stall** around 150–165°F — temperature can sit flat for hours. This is normal: moisture is evaporating off the surface and cooling it.
8. **Wrap at 160°F.** Bark should be deep mahogany and set (doesn't smear when touched). Lay out two overlapping sheets of butcher paper. Brush the pork all over with the reserved baste and pour 2–3 Tbsp over the top. Wrap tight.
9. **Oven finish.** Into a 210°F oven, probe still in. Pull at **190°F**.
10. **Hold.** The pork keeps climbing in the cooler and sits in the 180–190s for hours — that long, gentle hold finishes melting the collagen. Leave the paper on. Wrap in heavy foil, set in the aluminum pan, wrap the pan in a towel. Put in a dry cooler and pack the gaps with towels. Close.
   - **Minimum rest:** 2 hours (carryover needs time to do its work).
   - **Safe hold:** up to 4 hours. Internal temp should stay above 140°F. Check once if it's going long.
11. **Shred.** Unwrap over the pan to catch juices. Remove the string. If bone-in, the bone should slide clean out. Shred with forks or gloved hands, discarding large fat pockets. Toss with the pan juices, then taste and add a pinch of salt or a splash of baste if needed.

## 2. Carolina Mustard Sauce

See [Carolina Mustard Sauce](#r/carolina-mustard-sauce). Make it a day ahead.

## 3. Jalapeño Crema Slaw

See [Jalapeño Crema Slaw](#r/jalape-o-crema-slaw). Build it within 2 hours of serving.

## 4. Quick-Pickled Red Onions

See [Quick-Pickled Red Onions](#r/quick-pickled-red-onions). Best made a day ahead.

## 5. Build the Sandwich

- 12–16 Hawaiian sweet rolls or buns
- Butter for toasting

1. Split and butter the buns. Toast cut-side down in a hot skillet until golden.
2. Bottom bun → pork → drizzle of mustard sauce → slaw → pickled onions → top bun.
3. Extra sauce on the table.

## Why This Works (Five Pillars)

**Salt.** 1% salt as a dry brine penetrates over 12–24 hours, seasoning deep into the meat and helping it hold moisture. The same 1% on cabbage pulls water out so the slaw stays crisp.

**Fat.** Pork butt is heavily marbled with collagen and fat. Low heat gives the collagen time to melt into gelatin — that's what makes it juicy and shreddable. Crema and mayo add a cool, creamy fat to balance the rich pork.

**Acid.** Acid shows up at every layer: vinegar baste, mustard sauce, lime crema, pickled onions. Each one cuts the pork's richness so every bite stays bright. Acid goes on late — at the wrap, at the sauce, at the table.

**Sweet.** Brown sugar in the rub builds bark; honey in the sauce rounds off vinegar's edge; Hawaiian buns echo it. All sugar stays at low temperatures (200°F), so it caramelizes without burning.

**Umami.** Long smoke and slow browning (Maillard reaction) create savory depth. Worcestershire in the sauce adds a fermented boost.

**Heat (temperature).** 200°F smoke maximizes smoke time and bark. Wrapping at 160°F pushes through the stall. A 210°F oven gives steady heat without burning pellets. Pulling at 190°F and holding in the cooler uses carryover heat to finish the collagen breakdown gently, so the meat shreds without drying out.

## Variants

- **Pressure cooker shortcut:** Rub, smoke 3 hours for flavor, then pressure cook 75 min with ½ cup baste, natural release. Less bark, same flavor profile.
- **Charcoal grill:** Set up for indirect heat (snake method) at 225°F with wood chunks.
- **Boneless butt:** Tying matters more here. Cook time drops 10–20%.
- **More smoke flavor:** Add a pellet smoke tube for the first few hours.
- **Heat level:** Leave jalapeño seeds in the crema, or add a minced serrano.

## Troubleshooting

| Problem | Fix |
|---|---|
| Stuck in stall for 4+ hrs | Normal. Wrap earlier at 155°F if timing is tight |
| Won't shred | Rest was too short, or probe was in a cold spot. Back in the 210°F oven, wrapped, 45–60 min |
| Pellets ran out overnight | Check the probe; if above 140°F, refill and keep going |
| Bark is soggy | Butcher paper breathes; foil doesn't. Don't skip the paper |
| Pork dried out | Toss with pan juices and a splash of baste |
| Watery slaw | Cabbage wasn't salted and squeezed |
| Running behind | Bump the oven to 250°F after wrapping |
| Light smoke ring / flavor | Pellet grills run cleaner than charcoal. Use Super Smoke or a smoke tube |

## Salt, Fat, Acid, Heat Tips

- **Salt early for big cuts.** Salt moves into meat slowly. The thicker the cut, the earlier it needs salt — a day ahead for a pork butt seasons it to the center instead of just the crust.
- **Match heat to the cut.** Tough, collagen-rich cuts want low heat and lots of time; tender cuts want high heat and little time. Pork butt is the poster child for low and slow.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Trust the thermometer and the probe, not the clock. Every pork butt is different.
- The stall isn't a problem. Don't panic and crank the heat.
- Start the day before. This one rewards planning.
- Make extra pork. It freezes great with a little of its own juice.

# Smoked Pork Ribs
### Smoked, paper-wrapped, oven-finished, flame-glazed

**Serves:** 4–6 (2 racks) | **Active:** ~1 hr | **Total:** 6–8 hrs + overnight dry brine
**Equipment:** Pellet smoker, oven, charcoal grill, probe thermometer, pink butcher paper, butter knife, paper towels, sheet pan with rack

## Game Plan

| When | What |
|---|---|
| Day before | Remove membrane, salt + rub. Fridge uncovered 12–24 hrs |
| Day before | Make glaze |
| Cook day, ~7 hrs before eating | Smoker on at 225°F, ribs in |
| Ribs hit 160°F (≈ 3–4 hrs) | Baste, wrap in butcher paper, into 210°F oven |
| Ribs hit 195°F (≈ 1.5–2.5 hrs) | Out of the oven; light the grill |
| Grill ready | Sauce and sear 6–10 min total |
| Off the grill | Rest 10 min, slice between bones |

## 1. The Ribs

### Ingredients

**Meat**
- 2 racks St. Louis–cut spare ribs, ~3 lb each (about 6 lb total)

**Dry brine + rub** (same rub as Smoked Pork Butt — house rub)
- 2 Tbsp Morton kosher salt — about 1% of meat weight
- 3 Tbsp dark brown sugar, packed
- 2 Tbsp sweet paprika
- 1 Tbsp smoked paprika
- 2 tsp coarse black pepper
- 2 tsp granulated garlic
- 1½ tsp onion powder
- 1½ tsp dry mustard
- ¼ tsp cayenne

**Vinegar-sugar baste** (same as Smoked Pork Butt)
- ½ cup apple cider vinegar
- 1 Tbsp dark brown sugar
- ½ tsp kosher salt
- ½ tsp red pepper flakes

**Pellets:** Competition blend.

### Steps

1. **Remove the membrane.** Bone side up. Slide a butter knife under the thin, shiny membrane at one end, between the bone and the membrane. Lift a corner, grab it with a paper towel, and pull it off in one sheet. If it tears, start a new corner. This lets the rub in and keeps the ribs from being chewy on the back.
2. **Trim and dry.** Cut off any loose flap of meat and hard fat — thin, hanging bits burn. Pat both sides dry with paper towels so the rub sticks and the bark forms.
3. **Weigh and salt.** Salt at 1% of meat weight: 1 tsp Morton per pound. Mix with the rub spices.
4. **Dry brine + rub.** Coat both sides, heavier on the meat side. On a rack over a sheet pan, uncovered, in the fridge 12–24 hours.
5. **Make the baste.** Warm to dissolve, cool. Half in a spray bottle, half reserved for wrapping.
6. **Smoke.** Pellet smoker at 225°F. Ribs in, meat side up. Probe in the thickest meat between bones, not touching bone. Use Super Smoke for the first 2 hours if you have it.
7. **Spritz.** After 2 hours, spritz every 45–60 minutes when the surface looks dry.
8. **Wrap at 160°F.** Bark should be set and mahogany. One rack per sheet of butcher paper, meat side down. Brush with reserved baste, pour 1–2 Tbsp over, wrap tight.
9. **Oven.** 210°F, probe in. Pull at **195°F**.
10. **Grill finish.** Set up a two-zone fire: coals on one side, ~400–450°F over the coals. Unwrap the ribs.
    - Bone side down over the **direct** heat, 1–2 min to firm up.
    - Brush glaze on the meat side, flip meat side down over direct heat, 1–2 min until it bubbles and spots dark. **Don't walk away** — sugar burns fast.
    - Flip, glaze again, move to the **indirect** side, lid on, 3–5 min to set.
    - Repeat a third coat if you want it sticky. Target ~200–203°F and the bend test (below).
11. **Rest and slice.** Rest 10 minutes meat side down on a board. Slice between bones with a long knife.

### The bend test
Pick up the rack with tongs about ⅓ in from one end. It should sag deeply and the surface should crack. If it barely bends, it needs more time. If it breaks apart, it's overcooked (still delicious).

## 2. Spicy House Red Glaze

See [Spicy House Red Glaze](#r/spicy-house-red-glaze). Make it a day ahead — the heat builds overnight.

## Pair With

- [Jalapeño Crema Slaw](#r/jalape-o-crema-slaw)
- Red, Black & White Bean Salad
- Hot-Pan Blistered Green Beans
- Grilled corn on the cob

## Why This Works (Five Pillars)

**Salt.** 1% overnight dry brine seasons through and helps the meat hold moisture over a long cook.

**Fat.** Spare ribs have plenty of fat and collagen between the bones. Low heat renders the fat and turns collagen into gelatin, which gives ribs their tender, juicy bite.

**Acid.** Vinegar baste at the wrap and vinegar in the glaze cut the richness. Mustard adds a second, sharper acid.

**Spice.** Chipotle brings smoky heat that echoes the smoker; cayenne and hot sauce add sharper heat. Sugar and fat in the glaze and ribs round off the burn.

**Sweet.** The rub's brown sugar builds bark at low smoker heat. Glaze sugars (brown sugar, molasses, honey) go on at the very end on purpose — this is the one place we want sugar on high heat, briefly, for caramelization. Minutes, not hours.

**Umami.** Smoke, Maillard browning, tomato (ketchup), and Worcestershire stack savory depth.

**Heat (temperature).** 225°F smoke sets bark faster on thinner ribs than the 200°F used for pork butt. Paper-wrapping pushes through the stall without steaming off the bark. Pulling at 195°F leaves room for the grill to finish without overcooking. The direct-heat grill hits the glaze with intense heat for a crust you can't get in an oven or smoker.

## Variants

- **Baby back ribs:** Smaller racks (~2 lb). Smoke to 160°F (≈ 2–2.5 hrs), oven ~1–1.5 hrs. Salt at 1 tsp Morton per pound.
- **Mild glaze for the kids:** Skip the chipotles, hot sauce, and pepper flakes; use ¼ tsp cayenne.
- **Mustard glaze:** Swap in [Carolina Mustard Sauce](#r/carolina-mustard-sauce).
- **Country-style ribs:** See the separate Dutch Oven Country-Style Pork Ribs recipe.
- **Dry ribs (Memphis style):** Skip the glaze. Hit with a dusting of rub on the grill instead.
- **No charcoal:** Finish under the oven broiler, 3–4 inches from the element, 2–3 min per coat. Watch it closely.

## Troubleshooting

| Problem | Fix |
|---|---|
| Membrane won't come off | Dry your fingers and use a paper towel for grip |
| Glaze burned | Fire too hot or too long over direct heat. Scrape the black bits, re-glaze on the indirect side |
| Ribs tough | Undercooked. Wrap back up, 210°F oven 30 more minutes |
| Meat falling off the bone | Overcooked. Still great — serve as pulled rib meat |
| Glaze runny, won't stick | Simmer it longer to thicken |
| Ends dried out | Trim loose ends next time, or tuck them under when wrapping |

## Salt, Fat, Acid, Heat Tips

- **Browning is flavor.** Dry surfaces brown; wet surfaces steam. Patting dry and dry-brining are both about getting the surface ready to brown.
- **Acid balances fat.** Rich, fatty meat tastes heavy without something sharp. The vinegar in the baste and glaze is doing as much work as the sugar.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Always pull the membrane. It takes 30 seconds and makes a real difference.
- The bend test beats the thermometer for ribs — bones make probe readings tricky.
- Stay at the grill for the glaze. It goes from perfect to burned in about 30 seconds.
- Same rub and baste as the pork butt. Learn it once, use it everywhere.

# Texas-Style Smoked Beef Short Ribs
### Plate "dino" ribs, pepper-forward bark, paper-wrapped to probe-tender

Adapted from Meathead's Texas beef short ribs at AmazingRibs. The cook times and temperatures follow that method. The 1% dry brine, house baste and paper wrap are our own adaptations to match the rest of the book.

**Serves:** 3–4 (one 3–4 bone rack) | **Active:** 30 min | **Total:** 7–8 hrs + overnight dry brine
**Equipment:** Pellet smoker, CHEF iQ probe (plus an instant-read), pink butcher paper, spray bottle, sharp knife, cutting board with juice groove

## Game Plan

| When | What |
|---|---|
| Day before | Trim the meat side, weigh, salt and rub. Fridge uncovered 12–24 hrs |
| Cook day, ~8 hrs before eating | Smoker on at 250°F, ribs in |
| Every 30 min after the first hour | Spritz if the surface looks dry |
| Ribs reach 170–180°F (≈ 4–5 hrs) | Wrap in paper with a splash of liquid, back in at 275°F |
| Ribs reach about 203°F and probe like butter (≈ 1 hr) | Pull, rest in a cooler 30–60 min |
| Serving | Slice between the bones |

Times are guides. Probe feel decides when it's done, not the clock.

## Ingredients

**Meat**
- 1 rack beef plate short ribs, 3–4 bones, about 5 lb. Ask for **plate** ribs (the big, meaty ones), not chuck short ribs

**Dry brine + rub**
- 1 tsp Morton kosher salt per pound of trimmed meat, about 1% of weight (5 lb → 5 tsp)
- 2 Tbsp coarse black pepper (16-mesh if you can find it)
- 1 Tbsp granulated garlic
- 1 tsp smoked paprika
- Optional: 1 tsp dry mustard

**Spritz and wrap liquid**
- ½ cup apple juice
- ½ cup apple cider vinegar
- Plus ½ cup extra apple juice or beef broth for the wrap

**Pellets:** Competition blend. Hickory or oak-leaning blends suit beef.

## Steps

1. **Trim the meat side only.** Remove hard fat and silverskin from the top (meat side). **Leave the thin membrane on the bone side.** It holds the rack together. Cut off any thin, dangling flaps. They burn.
2. **Dry and salt.** Pat the whole rack dry. Weigh the trimmed rack and salt at 1%: about 1 tsp Morton per pound.
3. **Rub.** Mix the pepper, garlic, paprika and mustard. Season the bone side first, then the meat side. Set on a rack over a sheet pan, **uncovered, in the fridge 12–24 hours.** Salt needs time to move into thick beef.
4. **Make the spritz.** Combine the apple juice and vinegar in a spray bottle.
5. **Smoke.** Smoker at **250°F** (use 275°F if the rack is closer to 6 lb or more). Ribs on **meat side up**, away from direct heat. Probe in the thickest meat, between bones, without touching bone.
6. **Spritz.** After the first hour, spritz every 30 minutes if the surface looks dry. Don't open the lid more than you need to.
7. **Wrap at 170–180°F.** This takes roughly 4–5 hours. The bark should be dark and set and not smear when touched. Lay out two overlapping sheets of butcher paper. Set the rack on it, splash on about ½ cup of apple juice or broth, and wrap snug.
8. **Finish.** Back in the smoker, now at **275°F**, until the probe reads about **203°F** and slides in with almost no resistance, like warm butter. This usually takes about an hour. **Probe feel beats the number.** Check between several bones.
9. **Optional firmer bark:** Unwrap at 198–200°F and finish uncovered.
10. **Rest.** Leave in the paper, wrap in a towel, and hold in a dry cooler 30–60 minutes. Juices redistribute and the meat sets up enough to slice.
11. **Slice.** Cut between the bones with a long sharp knife. Spoon the juices in the paper over the meat.

## Pair With

- [Jalapeño Crema Slaw](#r/jalape-o-crema-slaw)
- [Quick-Pickled Red Onions](#r/quick-pickled-red-onions)
- Red, Black & White Bean Salad
- Hot-Pan Blistered Green Beans
- Plain white bread and pickles, Texas style

## Why This Works (Five Pillars)

**Salt.** A 1% overnight dry brine seasons deep into a very thick cut. Surface salt alone can't reach the center of a ribs this size.

**Fat.** Plate ribs are heavy with fat and collagen. Low steady heat renders the fat and melts the collagen into gelatin, which gives the rich, juicy texture. This is why they're called better than brisket by some pitmasters.

**Acid.** Apple cider vinegar in the spritz cuts the richness and helps build a tangy, balanced bark. A squeeze of lemon or a pickle alongside does the same at the table.

**Sweet.** Apple juice in the spritz and wrap adds just enough sweetness to round off the pepper without burning at smoker temperatures.

**Umami.** Beef, smoke and the dark bark. Long, slow Maillard browning builds the deep savory flavor.

**Heat (temperature).** 250°F gives enough time to tenderize and develop smoke. The wrap pushes through the stall, keeps the meat moist and speeds the finish. Butcher paper lets the bark breathe, so it stays firmer than foil. Doneness is by feel: when collagen has fully melted, the probe slides in without resistance.

## Variants

- **Foil wrap:** Faster and moister but softer bark, as in the original method. Use foil with the same liquid.
- **Faster, hotter cook:** 325°F is quicker but gives a lower-quality result, since less time at gentle heat means less rendering.
- **Charcoal grill:** Indirect heat, snake method, 250°F with a couple of oak chunks.
- **Leftovers:** Chop for tacos, fold into the Dutch Oven Beef Stew, or crisp in a skillet for breakfast hash.

## Troubleshooting

| Problem | Fix |
|---|---|
| Probe still tight at 203°F | Not done. Collagen needs more time. Keep going and check every 20–30 minutes |
| Bark soft or soggy | Used foil, or wrapped too early. Use paper and unwrap near the end |
| Bark too dark or bitter | Too much pepper or too much direct heat. Cut the pepper, keep the rack away from the fire |
| Dry meat | Pulled too early or skipped the wrap liquid. Spoon juices over each slice |
| Rack falls apart | Membrane removed or overcooked. Leave the bone-side membrane on |
| Stall for hours | Normal. Wrap at 170–180°F to power through |

## Salt, Fat, Acid, Heat Tips

- **Match the salt timing to thickness.** The thicker the cut, the earlier it needs salt. A thick rack salted the night before tastes seasoned through, not just on the crust.
- **Go by feel, not the clock.** For tough, collagen-rich cuts, tenderness is the signal. The temperature gets you close, and the probe tells you when it's done.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Ask the butcher for **plate** short ribs. Chuck short ribs are a different cut.
- Don't strip the membrane on the bone side. Unlike pork ribs, it holds the rack together.
- Done is when the probe feels like going into soft butter. Not before.
- This is a weekend cook. Start the day before and plan the whole day around it.

# Grilled Crispy-Skin Chicken Thighs, Two Flavors
### Charcoal-grilled bone-in thighs, half tossed in garlic Parmesan, half in honey mustard

**Serves:** 4–6 (8 thighs) | **Active:** 30 min | **Total:** 1 hr + overnight dry brine (optional but best)
**Equipment:** Charcoal grill, chimney starter, tongs, instant-read thermometer, sheet pan with rack, 2 large mixing bowls

## Ingredients

**Chicken**
- 8 bone-in, skin-on chicken thighs (~3 lb)

**Dry brine**
- 1 Tbsp Morton kosher salt — 1% of meat weight
- 1 tsp black pepper
- 1 tsp garlic powder
- 1 tsp smoked paprika
- 2 tsp baking powder (aluminum-free) — **baking powder, not baking soda.** Soda tastes soapy and metallic on skin.

**Flavor 1 — Garlic Parmesan**
- ½ cup store-bought garlic Parmesan wing sauce

**Flavor 2 — Honey Mustard**
- ½ cup Chick-fil-A sauce **or** Ken's honey mustard

## Steps

### Prep (day before is best)
1. **Trim.** Trim any skin or fat hanging well past the meat — it's pure flare-up fuel. Leave the skin covering the thigh.
2. **Dry thoroughly.** Pat bone-dry with paper towels. **Dry skin crisps; wet skin steams.**
3. **Dry brine.** Mix salt, pepper, garlic powder, paprika, and baking powder. The baking powder raises the skin's pH so it browns faster and dries into tiny crisp bubbles. Season all sides, more on the skin.
4. **Air-dry.** Skin up on a rack over a sheet pan, uncovered, in the fridge **4–24 hours**. The skin dries out like parchment — that's what makes it crisp. (No time? Season and grill right away; still good.)

### Grill
5. **Two-zone fire.** Full chimney of charcoal, all on one side. Cool side has no coals. Clean and oil the grates. Lid on to preheat, vents open, 10 minutes.
6. **Render on indirect.** Thighs **skin side up** on the cool side, thickest part toward the coals. Lid on, top vent over the chicken to draw heat across. **25–35 minutes** until the thighs read **155–160°F**. This renders the fat out of the skin slowly, with no dripping onto coals.
7. **Crisp on direct.** Move thighs **skin side down** over the coals. **2–4 minutes**, lid open, until skin is deep golden and crackly. **Stay at the grill.**
8. **Watch for flare-ups.** If flames lick the chicken, slide that piece to the cool side for 30 seconds and bring it back once the flames settle. Don't spray with water — it kicks up ash.
9. **Finish.** Flip skin up. Pull when they read **175–185°F** at the thickest part near the bone. (Safe at 165°F, but thighs are juicier and more tender at 175+ because the connective tissue melts.)
10. **Rest** 5 minutes on a rack, skin up — not on a plate, where the skin sits in steam.

### Toss — last minute
11. **Set up two bowls** while the chicken rests: garlic Parm wing sauce in one, honey mustard in the other. Bring both to room temp (cold sauce chills the chicken).
12. **Toss at the last possible minute** — right as everyone sits down. Half the thighs into each bowl, toss to coat, onto the platter, serve. Every minute in sauce softens the skin.

## Pair With

- Chilled Lemon Asparagus
- Hot-Pan Blistered Green Beans
- Chilled Lentils with Shallot Vinaigrette
- Pickled Beet & Burrata Salad

## Why This Works (Five Pillars)

**Salt.** A 1% dry brine overnight seasons deep into the meat and pulls moisture out of the skin. Dry skin is crisp skin. Both sauces are salty, so don't add salt at the end.

**Fat.** Chicken skin is mostly fat. Slow indirect heat renders it out first, leaving thin, crisp skin. Both store sauces are butter- or mayo-based and cling like a glaze.

**Acid.** Mustard brings sharp acid to the honey mustard. Add a squeeze of lemon to the garlic Parm thighs if they taste heavy.

**Sweet.** Honey balances the mustard. Sugar burns on the grill, which is why sauces go on **after** cooking, never before.

**Umami.** Charred, rendered skin (Maillard browning) and the Parmesan in the wing sauce.

**Heat (temperature).** Two zones solve the flare-up problem. Indirect heat cooks the meat and renders the fat away from the coals. Direct heat comes last and fast, only to crisp — by then most of the fat that causes flare-ups is gone.

## Variants

- **Pellet smoker:** 375°F skin up, 35–45 minutes to 175°F, then 2 minutes over the charcoal grill's direct side (or under the broiler) to crisp.
- **Oven:** 425°F on a rack, skin up, 35–45 minutes.
- **Other flavors:** Any store wing sauce works — Buffalo, lemon pepper, sweet chili.
- **Fresh finish:** Extra grated Parmesan and chopped parsley over the garlic Parm thighs.
- **Boneless thighs:** Skip the indirect step; 4–5 minutes per side over medium direct heat. Watch closely.

## Troubleshooting

| Problem | Fix |
|---|---|
| Rubbery skin | Not dried enough, or not enough indirect time to render. Dry-brine uncovered overnight |
| Constant flare-ups | Too much fat dripping on direct heat. Trim overhang; render longer on indirect first |
| Burnt skin, raw inside | Started on direct heat. Always indirect first, direct last |
| Skin soggy after tossing | Tossed too early. Toss right before eating |
| Soapy or metallic taste | Baking soda was used instead of baking powder |

## Salt, Fat, Acid, Heat Tips

- **Salt a day ahead when you can.** Early salt seasons the meat deeply and dries the skin — two jobs at once.
- **Use more than one heat.** Gentle heat to cook through, intense heat to brown. Two-zone grilling is that idea built into the fire.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Dry the skin. Then dry it again.
- Cool side first, hot side last. That's the whole trick.
- Don't walk away during the direct-heat crisp. Thirty seconds is all it takes to go from golden to burnt.
- Thighs at 175°F beat breasts at 165°F every time.
- Sauce goes on at the last minute. Always.
- Baking **powder**, not baking soda. Check the can.

# BBQ Wings, Two Ways
### Smoked and reverse-seared, or grill-only (with an oven finish option)

**Serves:** 4 (about 3 lb wings) | **Active:** 30 min | **Total:** 1.5 hrs + overnight dry brine
**Equipment:** Charcoal grill, chimney starter, tongs, instant-read thermometer, sheet pan with rack, large mixing bowl. Method A: pellet smoker. Oven option: oven.

## Pick Your Method

| | **A. Smoke + Reverse Sear** | **B. Grill Only / Grill to Oven** |
|---|---|---|
| Flavor | Deep smoke, crisp char | Charcoal char, quicker |
| Time | ~1.5 hrs | ~45 min |
| Equipment | Pellet smoker + charcoal grill | Charcoal grill (+ oven option) |
| Best for | Weekends, bigger batches | Weeknights, fewer tools |

Prep, sauce, and toss are the same for both.

## Ingredients

**Wings**
- 3 lb chicken wings, split into flats and drums, tips removed (save for stock)

**Dry brine**
- 1 Tbsp Morton kosher salt — 1% of meat weight
- 1 Tbsp baking powder (aluminum-free) — **powder, not soda**
- 1 tsp black pepper
- 1 tsp garlic powder
- 1 tsp smoked paprika

**Sauce**
- ¾ cup store-bought BBQ sauce — whatever fits your mood: sweet, spicy, smoky, Carolina, Alabama white
- 1 Tbsp butter, melted — loosens the sauce for tossing

## Prep (both methods)

1. **Dry.** Pat wings completely dry with paper towels.
2. **Dry brine.** Mix salt, baking powder, and spices. Toss wings in a bowl until evenly coated.
3. **Air-dry.** Single layer on a rack over a sheet pan, uncovered, in the fridge **8–24 hours**. The skin should look dry and slightly translucent. (Minimum 2 hours if you're short on time.)

## Method A — Pellet Smoker + Reverse Sear

1. **Smoke.** Pellet smoker at **250°F**, competition blend pellets. Wings on the grates in a single layer. Smoke **45–60 minutes** until they read **160°F**. The skin will be golden but still soft — that's expected.
2. **Fire the grill.** While wings smoke, light a full chimney and set up a two-zone fire.
3. **Reverse sear.** Wings onto the **direct** side, **2–3 minutes per side**, lid open, turning often until the skin is crisp and charred in spots. Watch for flare-ups — slide wings to the cool side if flames jump.
4. **Done:** **175–190°F.** Wings are safe at 165°F but much better higher; the connective tissue melts and the meat pulls off the bone.
5. Rest on a rack while you warm the sauce. Go to **Sauce and Toss**.

## Method B — Grill Only

1. **Two-zone fire.** Full chimney on one side. Clean and oil grates. Lid on, vents open, preheat to ~375–400°F.
2. **Indirect.** Wings on the cool side, lid on. **25–30 minutes**, flipping once halfway, until **165°F**. This renders the fat slowly with no flare-ups.
3. **Crisp direct.** Move to the hot side, **2–3 minutes per side**, lid open, until crisp and charred. Stay close.
4. **Done:** **175–190°F.** Go to **Sauce and Toss**.

### Option — Grill to Oven
Use when it's raining, the fire is fading, or you're cooking a big batch.
1. Oven to **425°F**, rack set over a sheet pan.
2. **Char first.** Wings over **direct** heat on the grill, **2–3 minutes per side**, just for color and grill flavor.
3. **Oven finish.** Onto the rack, **20–25 minutes** until crisp and **175–190°F**. The oven gives even, steady heat — no flare-ups, no babysitting.

## Sauce and Toss (both methods)

1. **Warm the sauce.** Sauce and melted butter in a small pan over low heat until loose and pourable. Pour into a large bowl.
2. **Toss at the last minute.** Wings in, toss to coat, onto the platter, serve. Sauce softens crisp skin quickly, so don't sauce until everyone's ready.
3. **Optional:** Extra sauce on the side for dipping.

## Pair With

- [Jalapeño Crema Slaw](#r/jalape-o-crema-slaw)
- Celery and carrot sticks
- Red, Black & White Bean Salad
- Hot-Pan Blistered Green Beans

## Why This Works (Five Pillars)

**Salt.** 1% dry brine seasons the meat and draws moisture out of the skin overnight. Most BBQ sauce is salty too, so no extra salt at the end.

**Fat.** Wings are mostly skin and fat. Low heat first (smoker or indirect) renders it slowly; high heat last crisps what's left. A little butter makes the sauce glossy and helps it cling.

**Acid.** Vinegar in the BBQ sauce cuts the rich, fatty skin.

**Sweet.** BBQ sauce sugar burns fast over coals, which is why it goes on **after** cooking — the book's "sugar off high heat" rule.

**Umami.** Smoke, Maillard browning on the char, and tomato and Worcestershire in the sauce.

**Heat (temperature).** Reverse sear = low and slow first, high and fast last. The low stage cooks and renders; the high stage crisps. Doing it backward (hot first) burns the outside before the fat renders.

**Baking powder.** Raises the skin's pH so it browns faster and dries into tiny crisp bubbles — fried-wing texture without the fryer.

## Variants

- **Dry rub wings:** Skip the sauce. Dust with the house rub (Smoked Pork Butt) right off the grill.
- **Two flavors:** Split into two bowls like the Grilled Chicken Thighs — BBQ and garlic Parm wing sauce.
- **Homemade sauce:** [Spicy House Red Glaze](#r/spicy-house-red-glaze) or [Carolina Mustard Sauce](#r/carolina-mustard-sauce).
- **Set the glaze:** After tossing, 30–60 seconds back over direct heat to caramelize the sauce. Watch closely — it burns fast.

## Troubleshooting

| Problem | Fix |
|---|---|
| Rubbery skin | Not dry enough, or skipped the high-heat finish. Air-dry overnight; crisp longer on direct |
| Flare-ups | Too much fat dripping on direct heat. Render longer on smoker/indirect first |
| Burnt sauce | Sauced before or during cooking. Sauce goes on after |
| Soggy after saucing | Tossed too early. Toss right before serving |
| Wings stuck to grates | Grates not clean, oiled, or hot. Let them release on their own |
| Soapy taste | Baking soda instead of baking powder |

## Salt, Fat, Acid, Heat Tips

- **Render first, crisp last.** Fat under skin needs gentle heat to melt out. Once it's gone, high heat makes what's left crisp.
- **Sweet goes on late.** Sugary sauces scorch over open flame. Cook first, sauce after.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Dry wings, overnight, uncovered. Every time.
- Low first, high last. That's reverse sear.
- 175–190°F. Wings want to be cooked past "safe."
- Sauce is the very last thing that happens.
- Save the wing tips in the freezer for chicken stock.

# Charcoal Ribeye with Garlic-Herb Butter, Two Ways
### Sear first and finish indirect for thick steaks, or hot and fast for thinner ones, always butter at the end

**Serves:** 2 | **Active:** 20 min | **Total:** 35 min for Method A, 25 min for Method B (plus 1 hr+ dry brine)
**Equipment:** Charcoal grill, chimney starter, tongs, CHEF iQ probe, instant-read thermometer, paper towels, sheet pan with rack

## Pick Your Method

| | **A. Sear First, Finish Indirect** | **B. Hot and Fast** |
|---|---|---|
| Best for | Thick steaks (1½–2 in) | Steaks 1–1¼ in |
| Time on the grill | 15–20 min | 8–12 min |
| Doneness | Deep crust, pink center, a little gray band | Deep crust, slightly more gray band |
| Margin for error | Forgiving, the probe tells you when | Pull on time, no wandering |
| Probe | CHEF iQ goes in after the sear | Instant-read only |

Same steak, same dry brine, same butter. Only the fire plan changes.

## Ingredients

**Steak**

- 2 bone-in or boneless ribeyes, 1–2 inches thick (14–20 oz each)
- Morton kosher salt: 1 tsp per pound of steak (about 2 tsp for two 1-lb steaks)
- 1 tsp coarse black pepper
- 1 tsp garlic powder
- ½ tsp smoked paprika (optional)
- 1 Tbsp avocado oil, to coat

**Garlic-herb butter** (make ahead)

- 4 Tbsp butter, softened
- 1 garlic clove, grated
- 1 tsp fresh thyme or rosemary, finely chopped
- ½ tsp lemon zest
- ½ tsp Worcestershire
- ¼ tsp Morton kosher salt

**To finish**

- Lemon wedge
- Flake salt

## Prep (both methods)

1. **Dry-brine.** Pat the steaks very dry. Salt every surface and the edges. Set on a rack over a sheet pan, uncovered, in the fridge **1 hour minimum, overnight best.** The surface dries out, which is what builds the crust.
2. **Make the butter.** Mash everything together. Roll into a log in wax paper or parchment and chill.
3. **Rub.** Pull the steaks 30 minutes before cooking. Mix the pepper, garlic powder, and paprika and press it on. No more salt.

## Method A: Sear First, Finish Indirect (thick steaks)

1. **Set up two zones.** Light a full chimney and pile the coals on one side. Let the grate get ripping hot, about 10 minutes, lid on. Clean and oil the grate. The cool side should sit around **300–350°F.**
2. **Oil and sear.** Rub a thin film of oil on the steaks. Over the hot coals, lid open, **60–90 seconds per side.** Stand each steak on its fat cap for about 30 seconds to render it.
3. **Move to the cool side.** Fat cap toward the coals, lid on.
4. **Probe.** Insert the CHEF iQ horizontally from the side into the center of the thickest part, away from bone. Set the alert for **120°F.**
5. **Finish indirect.** About **6–12 minutes**, depending on thickness and heat. Check with the instant-read near the alert.
6. **Pull at 125°F** for medium rare. Take the probe out.
7. **Butter at the end.** Put a thick slice of the garlic-herb butter on each steak right as it comes off. It melts into the juices as the steak rests.
8. **Rest 5–8 minutes.** The temperature climbs to 130–135°F.
9. **Slice** against the grain. Spoon the melted butter over, squeeze lemon, finish with flake salt.

## Method B: Hot and Fast (steaks 1–1¼ inches)

1. **Light a full chimney** and spread the coals over **half** the grate. Let the grate get ripping hot, about 10 minutes, lid on. Clean and oil the grate.
2. **Dry and oil.** The steaks should be bone dry. Rub a thin film of oil on the steaks, not on the grate.
3. **Sear.** Steaks over the hot coals, lid open. **2–3 minutes per side.** Flip once for a hard crust, or flip every minute for a more even cook (it works, it just takes watching).
4. **Render the edge.** Stand the steak on its fat cap for 30 seconds.
5. **Finish on the cool side** if the steak isn't at temperature yet. Lid on, **2–5 minutes.**
6. **Pull at 125°F** with the instant-read for medium rare. Don't leave the CHEF iQ probe in over direct flame.
7. **Butter at the end, rest, slice** exactly as in Method A, steps 7 to 9.

### Time guide (medium rare)

| Thickness | Method | Sear per side | Cool side | Pull at |
|---|---|---|---|---|
| 1 inch | B | 2 min | 0–2 min | 125°F |
| 1¼ inches | B | 2½–3 min | 2–4 min | 125°F |
| 1½ inches | A | 90 sec | 6–10 min | 125°F |
| 2 inches | A | 90 sec | 10–14 min | 125°F |

## Temperature Guide

| Doneness | Pull at | Final after rest |
|---|---|---|
| Rare | 115°F | 120–125°F |
| **Medium rare** | **125°F** | **130–135°F** |
| Medium | 135°F | 140–145°F |

## Pair With

- Hot-Pan Blistered Green Beans
- Chilled Lemon Asparagus
- Pickled Beet & Burrata Salad

## Why This Works (Five Pillars)

**Salt.** A 1% dry brine seasons deep and dries the surface. A dry steak browns; a wet steak steams. Pepper and garlic powder go on after, since they scorch in a long brine.

**Fat.** Ribeye is marbled and has a fat cap. Rendering the cap on the grate gives you beef fat flavor in the crust. Butter goes on at the end, off the fire, because milk solids burn at sear temperature.

**Acid.** Lemon on the slices cuts the richness. A rich steak with no acid tastes heavy by bite four.

**Sweet.** The crust is the sweetness. Browning caramelizes the steak's own sugars. No sugar in the rub, because it burns before the crust forms.

**Umami.** Seared beef, Worcestershire in the butter, and garlic.

**Heat (temperature).** Searing first locks in the crust while the steak is cold and the surface is dry. Moving to the cool side lets the center catch up without burning the outside. Thick steaks need that second phase; thin steaks don't.

## Variants

- **Reverse sear (the other way around):** Cook indirect at 250°F to 110°F, then sear 60–90 seconds per side. More even pink edge to edge, but slower (about 1½ hours total). Best for 2-inch cuts.
- **Cast iron instead of the grate:** Preheat a skillet on the coals for 10 minutes, then sear with 1 Tbsp avocado oil.
- **Blue cheese butter:** Replace the herbs and lemon zest with 2 Tbsp crumbled blue cheese.
- **Cowboy ribeye (2 in, bone-in):** Method A, add 3–5 minutes indirect.
- **Plain butter:** A 1 Tbsp pat of butter and flake salt if you want it simple.

## Troubleshooting

| Problem | Fix |
|---|---|
| Gray, no crust | Surface wet, or coals not hot enough. Pat drier, give the coals the full 10 minutes |
| Overshot the temp | Pull earlier next time (try 120°F) |
| Flare-ups | Move the steak to a calm spot and don't close the lid during the sear |
| Thick gray band | Sear too long. Cut the sear to 60 seconds per side and finish indirect |
| Bitter crust | Garlic powder or pepper scorched. Lower the sear heat slightly |
| Butter greasy, not saucy | It went on over direct heat. Add it only when the steak comes off |

## Salt, Fat, Acid, Heat Tips

- **Salt early, pepper late.** Salt gets time to work; pepper burns on a hard sear.
- **Butter at the end.** Fats have different jobs: high-smoke-point oil for the sear, butter for flavor after the heat is gone.
- **Rest the steak.** Cutting early lets the juice run onto the board instead of staying in the meat.
- **Match the method to the thickness.** Thin steaks want high heat and little time. Thick steaks need a sear, then a gentler second phase.

## Notes for the Kids

- Trust the thermometer, not the clock. Thickness, coal heat, and weather change everything.
- Pull 5°F early if you're nervous. You can always cook more; you can't undo it.
- Dry the steak. Then dry it again.
- Butter goes on last, after the steak is off the fire.
- Let it rest. It's the hardest part and worth it.

# Basic Smash Burgers
### Good beef, weighed balls, a screaming-hot griddle

**Serves:** 4 (double-patty burgers) | **Active:** 20 min | **Total:** 25 min
**Equipment:** Cast iron griddle or 12-inch cast iron skillet (or flat-top), stiff metal spatula with a sharp front edge, second spatula or heavy press, parchment squares, kitchen scale, infrared thermometer if you have one

## The Three Rules

1. **Meat quality is the burger.** Smash burgers are mostly crust and beef — there's nowhere for bad meat to hide.
2. **Weigh every ball.** Same weight = same thickness = same cook time. Every patty finishes together.
3. **The griddle must be ripping hot.** 450–500°F surface. Lower and the meat steams gray instead of forming a lacy brown crust.

## Ingredients

**Beef**
- 1½ lb 80/20 ground chuck, freshly ground, kept cold

**Fry sauce**
- ½ cup mayonnaise
- ¼ cup ketchup
- 1 tsp pickle brine
- ½ tsp garlic powder
- ¼ tsp onion powder
- ¼ tsp smoked paprika
- Pinch of black pepper
- *Hot variant:* 1–2 tsp hot sauce (Frank's, Cholula, or sriracha)

**Build**
- 4 potato buns
- 1 Tbsp butter, softened
- 8 slices American cheese
- ½ small white onion, sliced paper-thin
- Dill pickle chips

**Seasoning**
- Kosher salt and fresh-ground black pepper

## The Meat

**Best:** 80/20 chuck ground fresh at the store's meat counter. Ask for a coarse grind, ground today.
**Better still:** Ask the butcher to grind chuck with brisket or short rib (about 70/30 chuck to brisket). More beefy flavor and the right fat.
**Avoid:** Pre-packaged tubes and anything leaner than 80/20. Lean beef can't build a crust and dries out.

**Handling:**
- Keep it cold until the second it hits the griddle. Warm fat smears; cold fat renders into crust.
- Handle as little as possible. Overworked meat gets dense and springy.
- **No salt in the meat.** Salt mixed in turns burgers sausage-like. Salt goes on the surface after smashing.

## Steps

1. **Fry sauce.** Whisk everything. Chill at least 15 minutes so the spices bloom. Add hot sauce for the spicy version.
2. **Portion.** Weigh the beef into **8 balls of 3 oz each**. Roll loosely — just enough to hold together. Back in the fridge on a plate.
3. **Toast buns.** Butter the cut sides. Toast on the griddle over medium until golden. Set aside.
4. **Heat the griddle hard.** High heat, 5–10 minutes, until a drop of water vanishes instantly or the surface reads 450–500°F. Wipe a very thin film of oil across it.
5. **Smash.** Place 2–4 balls with space between. Lay a parchment square on each, and **within the first 30 seconds** press down hard with the spatula (use a second spatula on top for leverage) until about ¼ inch thick and slightly wider than the bun. Hold 10 seconds. Peel off the parchment. **Smash once only** — pressing later squeezes out juice.
6. **Season.** Salt and pepper the tops right away.
7. **Sear.** 2 minutes, untouched, until the edges are lacy and deep brown and the top shows red juice beading.
8. **Scrape and flip.** Get the sharp edge of the spatula under the patty and scrape hard — the crust is stuck to the griddle and you want it on the burger. Flip.
9. **Cheese and stack.** Immediately lay a slice on each patty. After 20 seconds, stack one patty on top of the other right on the griddle. 20–30 seconds more so the cheese melts between them and glues the stack together.
10. **Build.** Bottom bun → fry sauce → pickles → onion → double cheese stack → top bun with more fry sauce. Eat now.

## Pair With

- Fries or tots with extra fry sauce
- [Jalapeño Crema Slaw](#r/jalape-o-crema-slaw)
- Red, Black & White Bean Salad
- [Quick-Pickled Red Onions](#r/quick-pickled-red-onions) on the side

## Why This Works (Five Pillars)

**Salt.** Salt goes on the surface after smashing — it seasons the crust without changing the texture inside.

**Fat.** 80/20 is the minimum. As the fat renders on a hot griddle, the patty essentially fries in its own fat, which is what builds the crust. Cold fat going onto a hot surface is the key.

**Acid.** Pickles and pickle brine in the fry sauce cut through all that beef fat.

**Sweet.** Ketchup in the fry sauce, the soft potato bun, and raw onion's sharp sweetness.

**Umami.** The Maillard crust is the whole point. Smashing maximizes surface contact with the griddle, so a thin patty is almost all crust. American cheese adds salty, melty umami.

**Heat (temperature).** A thin patty cooks through in under 3 minutes, so the griddle has to be hot enough to brown in that time. Too cool and it's done before it browns.

## Variants

- **Oklahoma onion burger:** Pile paper-thin onion on the ball before smashing. Smash through it. Onions caramelize into the patty.
- **Charcoal-heat griddle:** Set the cast iron directly over a full chimney of coals on the charcoal grill. Hotter than most stovetops, and the smoke stays outside.
- **Fries:** Fry sauce is named for them. Make a double batch.

## Troubleshooting

| Problem | Fix |
|---|---|
| Gray, no crust | Griddle not hot enough. Wait longer; check with water drop or thermometer |
| Patty sticks to spatula | Use parchment between the spatula and meat |
| Crust left on griddle | Scrape harder with a sharp-edged spatula |
| Uneven patties | Weigh the balls; smash to an even thickness |
| Dry burger | Meat too lean, or smashed twice. 80/20 minimum, smash once |
| Smoke alarm | Normal. Open a window or use the charcoal grill variant |

## Salt, Fat, Acid, Heat Tips

- **Salt ground meat at the last minute.** Salt mixed into ground meat ahead of time changes its texture, making it springy like sausage. For burgers, season the surface right before or after it hits the heat.
- **Heat creates crust.** The hotter the surface, the faster the browning. Thin food needs very high heat to brown before it overcooks.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Ask the butcher to grind it fresh. Best burger upgrade there is.
- Use the scale. 3 oz every time.
- Hot griddle, smash once, don't touch it.
- Salt after smashing, never in the meat.

# Fat Burgers
### Beef and sausage, herbed, cheese mixed in — charcoal-grilled

**Makes:** 7–9 patties (6–8 oz each) | **Active:** 30 min | **Freeze:** 2 hrs | **Grill:** ~15 min
**Equipment:** Large bowl, food-safe gloves, kitchen scale, sheet pan, wax paper, charcoal grill, chimney starter, instant-read thermometer

## Ingredients

**Meat**
- 2 lb ground beef, 80/20, cold
- 1 lb uncased pork sausage, cold — any bold, savory sausage: mild or hot Italian, chorizo, andouille. **Not breakfast or sweet sausage** — the maple and sage fight the herbs.

**Binder**
- 2 large eggs
- ¾ cup panko

**Herbs (go heavy)**
- 2 Tbsp fresh thyme leaves, chopped
- 2 Tbsp fresh oregano leaves, chopped

**Seasoning**
- 1 tsp garlic salt
- 2 tsp paprika (sweet or smoked)
- 1 tsp coarse black pepper
- 1 Tbsp Worcestershire
- 1 Tbsp soy sauce
- Kosher salt: **¼ tsp only** (see Salt note)

**Cheese**
- 1 cup (4 oz) shredded cheese, to taste. **Go strong** — mild cheese disappears in all that meat. Extra-sharp cheddar, aged white cheddar, pepper jack, smoked gouda, or Gruyère.

**Build**
- Brioche or potato buns, toasted
- Lettuce, tomato, onion, pickles, sauces of choice

### Salt note
This mix already carries a lot of salt: the sausage is pre-seasoned, plus garlic salt, soy, Worcestershire, and cheese. Together they land right around the book's 1% rule. Only add the ¼ tsp kosher salt. Then **cook a test patty** (step 4) before forming.

## Steps

### Mix and form
1. **Panade.** In the big bowl, whisk eggs, Worcestershire, and soy. Stir in panko. Let it soak 5 minutes into a paste.
2. **Season.** Add herbs, garlic salt, paprika, pepper, and salt to the paste. Stir.
3. **Mix by hand.** Gloves on. Add beef, sausage, and cheese. Mix with fingertips just until evenly combined — streaks of sausage gone, about 1 minute. Stop there. Overmixing makes a tight, springy burger.
4. **Test patty.** Pinch off a tablespoon, flatten, and fry in a skillet until cooked through. Taste. Adjust salt, pepper, or herbs now — this is your only chance.
5. **Weigh and form.** Weigh into **6–8 oz** portions. Shape each into a patty about 1 inch thick and ½ inch wider than your bun.
6. **Make the donut.** Press your thumb all the way through the center to make a hole about 1 inch wide. Thick patties puff into a dome as they cook; the hole lets the center cook evenly and closes up on the grill.
7. **Freeze to firm.** Lay on a wax paper–lined sheet pan, not touching. Freeze **2 hours** until firm but not rock solid. Firm patties hold together on the grates and don't fall apart when flipped.
   - **To store:** Freeze fully, then stack with wax paper between in a freezer bag. Up to 3 months. Thaw overnight in the fridge before grilling.

### Grill
8. **Two-zone fire.** Full chimney of charcoal, dumped on one side of the grill. Clean and oil the grates. Direct side should be ~450–500°F.
9. **Sear direct.** Patties straight from the freezer onto the hot side. **4–5 minutes**, lid open, without moving them, until there's a dark crust and they release easily.
10. **Flip and sear.** 4 minutes more on direct heat.
11. **Finish indirect.** Move to the cool side, lid on, vents open. Cook until the center reads **160°F**, about 4–8 minutes depending on thickness.
12. **Toast buns** on the direct side, 30–60 seconds, while patties finish.
13. **Rest 5 minutes.** Juices settle; carryover adds a couple of degrees.

## Pair With

- Grilled corn on the cob
- Hot-Pan Blistered Green Beans
- Chilled Lemon Asparagus
- Pickled Beet & Burrata Salad (bright contrast to a rich burger)

## Why This Works (Five Pillars)

**Salt.** Spread across sausage, garlic salt, soy, Worcestershire, and cheese — which is why the test patty matters more than any measurement.

**Fat.** Beef fat plus pork fat plus a strong cheese. The cheese mixed into the meat melts into pockets as it cooks, so every bite has some.

**Acid.** Worcestershire's tamarind and vinegar add a quiet tang. Pickles and tomato on the bun do the rest.

**Sweet.** Paprika and the browned crust bring sweetness; Worcestershire has molasses.

**Umami.** Soy and Worcestershire are glutamate-heavy, layered on beef, pork, aged cheddar, and a charcoal-seared crust. This is the most umami-dense recipe in the book.

**Heat (temperature).** Two-zone fire: direct heat builds the crust, indirect heat cooks the thick center without burning the outside. Freezing first gives you more time on direct heat before the center overcooks.

**Herbs.** Fresh thyme and oregano, used generously, keep a rich burger from tasting heavy — the classic herbs of Italian sausage, echoed and amplified.

## Variants

- **Hot:** Use hot Italian sausage; add ½ tsp red pepper flakes.
- **Stuffed:** Skip the donut hole. Form two thin 4 oz patties, put a cube of cheese between, and seal the edges.
- **Smoky:** Add a chunk of hickory or a handful of soaked wood chips to the coals.

## Troubleshooting

| Problem | Fix |
|---|---|
| Patties fall apart | Not frozen long enough, or not enough binder. Firm them up longer |
| Sticking to grates | Grates not clean, oiled, or hot. Don't move patties until they release |
| Outside burnt, inside raw | Too long on direct heat. Move to indirect sooner |
| Domed burgers | Donut hole too small or skipped |
| Dense/rubbery | Overmixed. Mix only until combined |
| Too salty | Skip the kosher salt entirely; check the test patty |
| Cheese flare-ups | Normal. Move patties to the indirect side briefly |

## Salt, Fat, Acid, Heat Tips

- **Fat carries flavor.** Many aromatic compounds dissolve in fat, not water — so fat spreads the herbs, garlic, and cheese through every bite.
- **Taste raw mixtures by cooking a bite.** You can't taste raw meat, so fry a small piece. Adjust before you shape eight patties.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Gloves on. Cold meat, quick mixing.
- Fry a test patty. Taste before you make 8 burgers.
- The thumb hole isn't a mistake — it's why the burgers stay flat.
- These have pork and raw egg in them. Always use a thermometer and cook to 160°F.
- Make a double batch and freeze half. Future-you will thank you.

# Dutch Oven Country-Style Pork Ribs
### Seared, braised low and slow, then finished dry, BBQ-glazed, or in a red wine sauce

**Serves:** 4–6 (about 3 lb) | **Active:** 30 min | **Total:** 3½–4 hrs (1 hr rub time included)
**Equipment:** Enameled Dutch oven (5–7 qt) with lid, wood or silicone tools, instant-read thermometer, fat separator or spoon, rimmed sheet pan

## Pick Your Finish

| | **A. Dry (Memphis-style)** | **B. BBQ Glaze** | **C. Red Wine Sauce** |
|---|---|---|---|
| Flavor | Savory, spice crust, pure pork | Sweet, tangy, sticky | Deep, rich, wine-braised |
| Extra work | None | Make or warm the glaze | Reduce the pot juices |
| Best with | Anything; vinegar splash at the table | Slaw, green beans, corn | Rosemary potatoes, mash, polenta |

The seasoning, sear, and braise are the same for all three. Only the last 20 minutes change.

## Ingredients

**Meat**

- 3 lb bone-in or boneless country-style pork ribs

**Dry brine + rub** (house rub)

- 1 Tbsp Morton kosher salt — 1 tsp per pound
- 1 Tbsp dark brown sugar, packed
- 1 Tbsp sweet paprika
- 1½ tsp smoked paprika
- 1 tsp coarse black pepper
- 1 tsp granulated garlic
- ½ tsp onion powder
- ½ tsp dry mustard
- Pinch of cayenne

**Sear and braise**

- 2 Tbsp avocado oil
- 1 large yellow onion, sliced
- 4 garlic cloves, smashed
- ¼ cup apple cider vinegar
- **Liquid, choose one:** *Standard:* ¾ cup chicken stock (or apple cider) · *Red wine option (C):* ½ cup dry red wine + ¼ cup chicken stock
- 2 sprigs fresh thyme or rosemary (optional)

**Finish, choose one**

- **A. Dry:** Splash of cider vinegar and a squeeze of lemon at the table.
- **B. BBQ glaze:** ¾–1 cup [Spicy House Red Glaze](#r/spicy-house-red-glaze) or [Carolina Mustard Sauce](#r/carolina-mustard-sauce).
- **C. Red wine sauce:** the pot juices, plus 1 tsp Dijon, 1 Tbsp cold butter, and 1–2 tsp red wine vinegar.

## Steps

### 1. Season (an hour ahead, or the night before)

1. Pat the ribs completely dry. Dry meat browns; wet meat steams.
2. Weigh and salt at 1 tsp Morton per pound. Mix with the rest of the rub and coat every surface.
3. Rest at room temperature at least 1 hour, or uncovered on a rack in the fridge overnight.

### 2. Sear

1. **Heat the pot to medium-high.** Not high — a screaming-hot empty enameled pot can craze the coating. Add the oil and let it shimmer.
2. **Brown in batches.** Single layer with space between. Leave alone 3–4 minutes until a deep brown crust forms and they release, then turn. About 10–12 minutes total. Move to a plate.
3. **Pour off all but 1 Tbsp of fat.** Dark brown bits (fond) are flavor. If they're black, wipe out and use fresh oil.

### 3. Build the braise

1. Add onion and garlic. Stir 2–3 minutes until they pick up color and loosen the fond.
2. Pour in the vinegar and scrape the bottom until the bits dissolve. Simmer 1 minute.
3. Add the liquid. If using wine, simmer 3 minutes so the alcohol cooks off.
4. Nestle the ribs back in. Liquid should come about **one-third up the sides**. Tuck in the herbs.

### 4. Braise

1. Bring to a bare simmer, cover, and move to a **300°F oven**.
2. **2–2½ hours.** Turn once at 1 hour. Ready when a fork slides in with no resistance and the thickest piece reads **195–200°F**. Not tender yet? Cover and give it 20 more minutes.

### 5. Finish

**A. Dry (Memphis-style):** Uncover, **425°F** for 15–20 minutes until the rub darkens into a crust. Optional thin coat of defatted pot juices at 10 minutes. Rest 10 minutes. Vinegar or lemon at the table.

**B. BBQ glaze:** Ribs onto a foil-lined sheet pan. Oven to **425°F** (or broil, rack 5–6 inches down). Brush a thick coat of glaze. Roast 8 minutes, brush again, 5–8 minutes more until bubbling and spotty dark. **Don't walk away.** Rest 10 minutes.

**C. Red wine sauce:** Ribs to a plate, tented. Defat the pot juices, return to the pot with the Dijon, and reduce over medium-high 8–10 minutes by about half. **Off the heat,** swirl in cold butter. Add red wine vinegar a teaspoon at a time until bright, not sharp. Return ribs, turn to coat, rest 5–10 minutes.

## Pair With

- Hot-Pan Blistered Green Beans
- Rosemary potatoes: parboil 8 minutes in salted water, drain, shake rough, toss with rosemary oil and flake salt, roast at 425°F 30–35 minutes.
- [Jalapeño Crema Slaw](#r/jalape-o-crema-slaw) (with the BBQ glaze)
- Mashed potatoes or polenta (with the red wine sauce)
- A fruity, low-tannin red: Zinfandel, Grenache, Syrah, or chilled Beaujolais

## Why This Works (Five Pillars)

**Salt.** 1% by weight, an hour to a day ahead, seasons through to the center and helps the pork hold moisture.

**Fat.** Country-style ribs come from the shoulder end of the loin, with plenty of marbling and connective tissue. Slow heat melts collagen into gelatin. Skimming at the end keeps the sauce clean.

**Acid.** Vinegar in the deglaze cuts the richness. In option C, red wine adds a second layer and a splash of vinegar at the end brightens the sauce.

**Sweet.** Brown sugar in the rub, softened onions, and glaze sugar balance the acid. Sugar sees high heat only briefly, at the end.

**Umami.** The sear, the fond, onions, and tomato and Worcestershire in the glaze build depth.

**Heat (temperature).** Sear hot for flavor, braise low and slow for tenderness, finish at 425°F for crust. Wet heat for tenderness; dry heat for texture.

## Variants

- **Pressure cooker shortcut:** Sear, add ½ cup liquid and vinegar, high pressure 35–40 minutes, natural release. Finish as above.
- **Slow cooker:** Sear in a skillet first, then 6–7 hours on low. Finish in the oven.
- **Beef short ribs:** Same method; braise 3–3½ hours.
- **Add vegetables:** Carrots and potatoes in the pot for the last hour.
- **Smoke first:** 1 hour at 225°F on the pellet smoker, then into the pot.

## Troubleshooting

| Problem | Fix |
|---|---|
| Ribs tough | Under-braised. Cover and cook 20–30 more minutes |
| Dry | Too little liquid, or lid not tight. Keep it one-third up the sides |
| Gray, no crust | Pot not hot enough, meat wet, or crowded |
| Fond burned | Pot too hot. Medium-high only; deglaze before it blackens |
| Sauce too thin | Reduce longer. Too thick: add a spoon of stock |
| Sauce greasy | Not defatted. Skim again |
| Sauce too sharp | Simmer longer; add a pinch of sugar or a pat of butter |
| Chips in the coating | Wood, silicone, or nylon tools only. No empty pot on high heat |

## Salt, Fat, Acid, Heat Tips

- **Braise = sear + liquid + time.** The same method works for short ribs, chicken thighs, lamb shanks, and pork shoulder.
- **Finish with acid.** A braise cooked for hours can taste flat. A little vinegar or lemon at the end fixes that.
- **Separate the fat before you sauce.** Fat carries flavor, but too much makes a sauce heavy.

## Notes for the Kids

- Brown the ribs well. That crust turns into the sauce.
- Medium-high, not high, in an enameled pot. Use wood or silicone tools.
- Check tenderness with a fork, not the clock.
- Dry, glazed, or wine sauce: all three are good. Pick by mood.

# Dutch Oven Beef Stew
### Day-ahead salted chuck, hard sear, red wine, low oven braise, finished with vinegar and butter

**Serves:** 6 | **Active:** 50 min | **Total:** ~4 hrs + overnight salt | Better on day two
**Equipment:** 5–6 qt Dutch oven with lid, rack and sheet pan, wooden spoon, instant-read thermometer

## The Short Version

Salt the beef the day before. Brown it hard in batches. Build a dark aromatic base in the same fat. Deglaze with wine and reduce. Braise at a bare simmer until a fork meets no resistance. Adjust acid and salt at the very end.

## Ingredients

**Beef**

- 3 lb beef chuck roast, hard fat trimmed, cut into 1½–2 inch cubes
- 1 Tbsp Morton kosher salt — 1% of meat weight (1 tsp per pound)
- 3 Tbsp neutral oil, for searing

**Aromatic base**

- 2 medium yellow onions, medium dice
- 2 medium carrots, cut in ¾-inch coins (first half — see "added late")
- 2 celery stalks, medium dice
- 8 oz cremini mushrooms, quartered
- 6 garlic cloves, sliced
- 2½ Tbsp tomato paste
- 4 anchovy fillets, minced (or 1 Tbsp fish sauce)
- 1 tsp Morton kosher salt

**Liquid**

- 1½ cups dry red wine — something with tannin and acid, not a jammy fruit bomb
- 3 cups low-sodium beef stock
- 2 bay leaves
- 6 sprigs fresh thyme

**Added late**

- 2 medium carrots, cut in 1-inch chunks
- 1 lb Yukon Gold potatoes, 1½-inch chunks
- 1 tsp Morton kosher salt

**Finish**

- 2–3 tsp red wine vinegar
- 2 Tbsp cold butter
- Flat-leaf parsley, chopped
- Black pepper

## Steps

### 1. Salt the day before (40 minutes minimum)

Pat the cubes dry. Toss with the 1 Tbsp salt. Spread on a rack over a sheet pan, uncovered, in the fridge overnight. The salt seasons through and helps the meat hold water; the surface dries out so it browns instead of steams.

### 2. Before you cook

Pull the beef 45 minutes ahead. Blot every cube dry again. Prep all vegetables. Open the wine. Oven to **275°F**, rack in the lower third.

### 3. Sear — the flavor foundation

1. Heat 2 Tbsp oil in the Dutch oven over medium-high until it shimmers.
2. Beef in a single layer with space between cubes — 3 or 4 batches. **Don't crowd. Don't stir.**
3. Leave each side 3–4 minutes until deep brown, not tan. Turn and brown a second face. Two good faces per cube is enough.
4. Move each batch to a bowl. If the fond goes from brown toward black between batches, add a splash of stock and scrape.

### 4. Build the base

1. Lower heat to medium. Add the remaining oil if the pot looks dry.
2. Onion, first-half carrots, celery, and mushrooms with 1 tsp salt. Cook 10–12 minutes, scraping, until the mushrooms have released their water and everything is browned at the edges.
3. Push the vegetables aside. Add tomato paste and anchovy to the bare spot. Stir 2–3 minutes until the paste darkens to brick red and the anchovy melts away. Add garlic for the last minute.

### 5. Deglaze

Pour in the wine and scrape every brown bit off the bottom. Simmer hard 5–6 minutes until reduced by about half and no longer smells boozy.

### 6. Braise

1. Return the beef and any juices. Add stock, bay, and thyme. Liquid should come about **two-thirds up the meat**, not cover it.
2. Bring to a bare simmer on the stove. Cover and move to the **275°F oven**.
3. **2 hours.** The liquid should barely smile — a bubble here and there, never a boil.

### 7. Add the late vegetables

Stir in the late carrots, potatoes, and 1 tsp salt. Cover and braise **45–60 minutes more** until the beef gives no resistance to a fork and the potatoes are tender.

### 8. Finish

1. Fish out the bay and thyme stems. Skim fat off the top.
2. Too thin? Simmer uncovered on the stove 10 minutes.
3. **Off the heat:** swirl in the cold butter. Add red wine vinegar 1 tsp at a time, tasting after each, until the stew tastes bright, not heavy. Adjust salt.
4. Parsley and black pepper on top.

## Why This Works (Five Pillars)

**Salt.** Salt in three places — on the beef a day ahead, in the vegetables, with the late additions — so every component is seasoned on its own. Final adjustment comes last, after reduction.

**Fat.** Chuck is marbled with fat and collagen. Low heat melts the collagen into gelatin, which gives the gravy body. Cold butter at the end adds gloss and roundness.

**Acid.** Acid three times: wine during the braise, tomato paste in the base, and vinegar off the heat. The last splash wakes up hours of slow cooking.

**Sweet.** Browned onions and carrots bring natural sweetness. Reducing the wine concentrates its fruit.

**Umami.** Anchovy + mushrooms + tomato paste + seared beef stack glutamate and nucleotides — they multiply each other. The anchovy disappears completely; nobody will taste fish.

**Heat (temperature).** 275°F, not 325°F. Even at 300°F a covered pot can boil, which tightens muscle fiber and wrings out juice. A bare simmer melts collagen without drying the meat.

## Variants

- **Pressure cooker:** Sear and build the base on sauté. Add liquid (reduce stock to 2 cups). High pressure 35 minutes, natural release 15. Add potatoes and late carrots, high pressure 5 minutes, quick release. Finish as above.
- **Slow cooker:** Sear and build the base on the stove, then low 8 hours. Add potatoes and late carrots for the last 2 hours.
- **Smoker:** Smoke the salted cubes at 225°F for 1 hour before searing for a smoky stew.
- **Outdoor charcoal Dutch oven:** Coals under and on the lid, roughly twice as many on top as underneath, refreshed every hour. Keep it at a bare simmer.
- **No wine:** Replace with more stock plus 2 Tbsp red wine vinegar added with the stock.

## Troubleshooting

| Problem | Fix |
|---|---|
| Beef tough | Not done yet. Give it 20–30 more minutes covered |
| Beef dry and stringy | Boiled instead of simmered. Lower the oven next time |
| Gravy thin | Simmer uncovered 10–15 minutes, or mash a few potato chunks into it |
| Tastes flat | Needs acid. Add vinegar 1 tsp at a time |
| Too salty | Add potatoes and a splash of water; skip extra salt |
| Gray meat, no crust | Wet beef or crowded pot. Dry it and sear in smaller batches |

## Salt, Fat, Acid, Heat Tips

- **Season in layers.** Salt each component as it goes in, then adjust at the end.
- **Acid twice.** Some during the cook for depth, a splash at the end for brightness.
- **A braise should barely bubble.** Gentle heat makes tender meat; boiling makes tough meat.

## Notes for the Kids

- Salt the beef the night before. It's the easiest upgrade in the book.
- Brown, don't gray. Small batches.
- The anchovy is a secret. Don't tell anyone and they'll never know.
- Taste at the end and add vinegar a little at a time. That's the step most people skip.
- It's better tomorrow. Make it a day ahead if you can.
