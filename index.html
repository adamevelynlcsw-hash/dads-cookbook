# Baked Fresh Cod, Three Ways
### On a bed of shallots or onions, cooked to temperature with the CHEF iQ probe

**Serves:** 4 | **Active:** 10 min | **Total:** 25–30 min
**Equipment:** 9×13 baking dish or rimmed sheet pan, CHEF iQ wireless thermometer (or any probe thermometer), paper towels

## The Base Method (all three)

### Why the bed
Fish releases liquid as it bakes. Laid straight on the pan, the bottom sits in that liquid and steams soft and gray. A bed of thin-sliced shallots or onions lifts the fillets out of it, catches the drippings, and turns into a soft, sweet, savory side you spoon over the fish.

### Why the probe
Cod goes from silky to dry in a couple of minutes, and thickness varies fillet to fillet. A probe takes out the guesswork.
- **Target: pull at 140°F.** Carryover heat brings it to about 145°F while it rests — fully cooked, flaky, still moist.
- Insert the probe **horizontally from the side** into the center of the **thickest** fillet. Make sure the tip sits in the middle, not poking through the bottom.
- In the CHEF iQ app, set a custom target of 140°F (or use the fish preset and adjust). It will alert you when it's time.

### Base ingredients
- 4 fresh cod fillets, 1–1½ inches thick (~1½ lb total). Thick, center-cut fillets bake evenly and hold a probe; thin tail pieces don't.
- 2 Tbsp olive oil or melted butter
- The bed (see each option): ~2 large shallots or 1 medium onion, sliced thin
- 1–2 lemons

### Base steps
1. **Oven to 400°F.** Rack in the middle.
2. **Dry the fish.** Pat fillets completely dry with paper towels. Wet fish won't take seasoning and steams.
3. **Build the bed.** Toss the sliced shallots or onions with half the oil or butter and a pinch of salt. Spread in an even layer in the dish where the fillets will sit. Add lemon slices on top of the bed if the option calls for it.
4. **Season the fish.** Brush fillets with the remaining fat. Season per the option you chose. Let sit 10 minutes while the oven finishes heating.
5. **Arrange.** Fillets on the bed, not touching. Tuck thin ends under so the fillet is an even thickness.
6. **Probe.** Insert into the thickest fillet. Set target 140°F.
7. **Bake.** About **12–18 minutes** depending on thickness, until the probe hits 140°F.
8. **Optional color:** Broil 1–2 minutes at the end. Watch it — seasoning blends with sugar darken fast.
9. **Rest 3 minutes.** Finish per your option. Serve with the softened shallots or onions spooned over.

## Option A — Kinder's Lemon Butter Garlic
*Rich, buttery, bright — the classic*

- **Bed:** 2 large shallots, thin-sliced, + 4 thin lemon slices on top
- **Fat:** 2 Tbsp melted butter
- **Seasoning:** 2–3 tsp Kinder's Lemon Butter Garlic (no extra salt — it's in the blend)
- **Fresh:** 2 garlic cloves, thin-sliced, scattered over the shallots
- **Finish:** Squeeze of lemon, 1 Tbsp chopped fresh dill

## Option B — Kinder's Lemon & Herb
*Herbal, French-style, lighter*

- **Bed:** 2 large shallots, thin-sliced, + 4 thin lemon slices on top
- **Fat:** 2 Tbsp olive oil
- **Seasoning:** 2–3 tsp Kinder's Lemon & Herb (no extra salt)
- **Fresh:** 1 garlic clove, grated, mixed into the oil before brushing
- **Finish:** Squeeze of lemon, chopped fresh dill and a little parsley. If you have fresh tarragon, a few leaves echo the blend.

### Why these two
Cod is lean, mild, and flaky — it needs **fat, acid, and aromatics**, and it gets buried by anything heavy, smoky, or sweet.
- **Lemon Butter Garlic** is the best match: real dairy butter supplies the fat cod lacks, lemon supplies acid, garlic supplies aroma — all three in one shake.
- **Lemon & Herb** is the lighter, herb-forward option: a south-of-France blend of lemon, garlic, sea salt, thyme, and tarragon. Tarragon and shallot are a classic French fish pairing, and it plays well with fresh dill.

### Other Kinder's blends, and why they're not the default for baked cod
| Blend | Verdict |
|---|---|
| **Lemon Pepper** | Good with fish, but cane sugar is the first ingredient — it can taste sweet on mild cod and burns under the broiler |
| **Blackened (Cayenne & Lemon)** | Made for blackening — screaming-hot cast iron, not a 400°F oven. Save it for pan-seared fish |
| **Buttery Garlic & Herb** | Works, but leans salty with no lemon. Add extra fresh lemon if using |
| **Roasted Garlic Brown Butter** | Nutty and rich; fine on cod, better on heartier fish like grouper or halibut |
| **Chipotle Pineapple** | Overpowers cod in the oven. Use it for fish tacos instead (with the Shrimp Tacos toppings) |

## Option C — Homemade Lemon-Dill
*Clean, bright, classic*

**Blend** (mix in a small bowl)
- 1½ tsp Morton kosher salt — 1% of fish weight
- ½ tsp black pepper
- Zest of 1 lemon
- 1 Tbsp fresh dill, chopped
- 1 Tbsp fresh parsley, chopped
- 1 garlic clove, grated

**Bed:** 2 large shallots, thin-sliced, + 4 thin lemon slices
**Fat:** 2 Tbsp butter — 1 Tbsp melted for brushing, 1 Tbsp in small pats on top
**Method:** Brush fish with melted butter, press the blend onto the tops, dot with butter pats.
**Finish:** Juice of ½ lemon over everything, a little more fresh dill.

## Pair With

- Chilled Lemon Asparagus (with or without bacon aioli)
- Hot-Pan Blistered Green Beans
- Chilled Lentils with Shallot Vinaigrette
- Plain rice (method in Ground Beef Bulgogi Rice Bowls)
- Pickled Beet & Burrata Salad

## Why This Works (Five Pillars)

**Salt.** Cod is lean and mild, so it needs real seasoning — 1% by weight in the homemade blend. The Kinder's blends carry their own salt; adding more over-salts the fish. Salt only 10 minutes ahead; longer and it starts to cure the delicate flesh.

**Fat.** Lean fish needs added fat to taste rich and stay moist. Butter in A and C (A's blend even has butter in it), olive oil in B. The bed catches the fat and fish juices so nothing is lost.

**Acid.** Citrus twice: slices baked under the fish infuse gently, and a fresh squeeze at the end brightens. Acid late keeps it vivid.

**Sweet.** Shallots soften and sweeten in the oven — just enough to round out the lemon.

**Umami.** Garlic, butter, and the savory shallot-bed juices in all three.

**Heat (temperature).** 400°F cooks thick fillets fast enough to stay moist. The probe ends the cook at the right moment — 140°F pull, 145°F after resting. Dry fish is almost always overcooked fish.

## Variants

- **Other fish:** Haddock, halibut, grouper, or snapper — same method, same 140°F pull. Salmon: pull at 125°F for medium.
- **Foil packets:** Same layers in foil, sealed, on the grill over medium indirect heat. Probe through the foil.
- **Add vegetables:** Cherry tomatoes and asparagus around the fillets (asparagus in the last 8 minutes).
- **Capers:** 1 Tbsp scattered over Option A or C.

## Troubleshooting

| Problem | Fix |
|---|---|
| Fish dry | Overcooked. Pull at 140°F; carryover does the rest |
| Bottom mushy/steamed | No bed, or bed too thin. Full layer of shallots or onions under each fillet |
| Probe reading jumps | Tip touching the pan or poking out the bottom. Reinsert from the side, centered |
| Uneven cooking | Thin ends cooked first. Tuck them under |
| Too salty | Added salt with a Kinder's blend. Skip it |
| Seasoning burned under broiler | Sugar in the blend. Broil 1 minute max, or skip |

## Salt, Fat, Acid, Heat Tips

- **Delicate food wants gentle handling.** Lean fish has little fat to protect it — pull it early and let carryover finish the job.
- **Salt fish shortly before cooking.** Delicate flesh cures if salted too long. Ten to fifteen minutes is plenty.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Thick fillets. Thin ones overcook before you can blink.
- Dry the fish. Every time.
- The onion bed is a dad trick — it keeps the bottom from going soggy, and the onions are the best part.
- Trust the probe. 140°F, then rest.
- Fish smells? It shouldn't. Fresh cod smells like clean ocean, not fishy.

# Butter-Basted Seared Scallops
### Dry scallops, a smoking-hot cast iron pan, and a quick lemon-shallot pan sauce

**Serves:** 3–4 as a main, 6 as a starter | **Active:** 25 min | **Total:** 40 min
**Equipment:** 12-inch cast iron, paper towels, instant-read thermometer, tongs, spoon for basting
**Inspired by:** America's Test Kitchen's pan-seared scallops, reworked with the book's salt rule and a pan sauce

## Buy the Right Scallops

- **Dry scallops** have no additives. Off-white or pinkish, a little tacky, and they sear to a deep crust. Ask for "dry-packed" and look for **U-10 or U-12** (under 10–12 per pound).
- **Wet scallops** are soaked in a phosphate solution. Bright white, sitting in milky liquid. They steam instead of sear.
- **The microwave test:** One scallop on a paper towel, 15 seconds. Dry leaves a small damp patch; wet leaves a wide wet ring.
- **If all you can find is wet:** Soak 30 minutes in 1 qt cold water + ¼ cup lemon juice + 2 Tbsp kosher salt. Then dry as below and use only pepper.

## Ingredients

**Scallops**

- 1½ lb large dry sea scallops (12–16)
- 1 tsp Morton kosher salt, divided — about 1% of weight (dry scallops only)
- ½ tsp coarse black pepper

**To cook**

- 2 Tbsp avocado oil, divided
- 2 Tbsp unsalted butter, divided

**Lemon-shallot pan sauce**

- 1 large shallot, finely minced
- 1 Tbsp fig vinegar or white wine
- 3 Tbsp cold unsalted butter, cubed
- 1 Tbsp lemon juice, plus zest of ½ lemon
- 1 Tbsp chopped parsley or chives
- Pinch of flake salt

## Steps

### 1. Prep

1. **Remove the side muscle.** Peel off the small, tough rectangle on the side of each scallop.
2. **Dry hard.** Between layers of paper towel, press gently. Sit **10 minutes**. Pat dry again. **Dry scallops brown; wet scallops steam.**
3. **Season at the last minute.** Salt and pepper both sides right before the pan.

### 2. Sear

1. **Heat the pan.** Cast iron over high heat 5 minutes. 1 Tbsp oil; it should shimmer and just start to smoke.
2. **First batch.** Half the scallops, flat side down, space between. **Don't touch them for 1½–2 minutes** until deep golden and they release on their own.
3. **Flip.** Add 1 Tbsp butter. It will foam.
4. **Baste.** Tilt the pan and spoon foaming butter over for **30–90 seconds**, until the centers read **115°F**. They rise to about 120–125°F as they rest.
5. **Rest and repeat.** Warm plate, uncovered. Wipe the pan. Repeat.

### 3. Pan sauce (60 seconds)

1. Heat to **medium-low**. Pour off all but 1 tsp fat.
2. Shallot, 30 seconds.
3. Fig vinegar or wine; scrape up the brown bits. Reduce to about a tablespoon.
4. **Off the heat,** swirl in cold butter a cube at a time until glossy. Lemon zest and juice, parsley, pinch of salt.
5. Spoon **around** the scallops so the crust stays crisp. Serve now.

## Pair With

- Chilled Lemon Asparagus
- Seared Brussels Sprouts with Fish Sauce Vinaigrette
- Buttered pasta tossed with the pan sauce
- Pickled Beet & Burrata Salad

## Why This Works (Five Pillars)

**Salt.** Scallops are mostly water, so salt goes on at the last second — early salt pulls water and ruins the sear.

**Fat.** Two fats, two jobs: oil for a hot pan, butter after the flip so it foams and flavors instead of burning.

**Acid.** Lemon and fig vinegar at the end keep sweet, rich scallops from tasting flat.

**Sweet.** Scallops are the sweetest seafood. The sear caramelizes their natural sugars.

**Umami.** Glutamate-rich scallops, a browned crust, and fond in the sauce.

**Heat (temperature).** Ripping-hot pan, dry surface, no crowding. Pull at 115°F; 125°F is already heading to rubbery.

## Variants

- **Charcoal grill:** Two parallel skewers, oil, high direct heat, 90 seconds per side.
- **Brown butter and sage:** Skip the shallot. Brown the butter, crisp 6 sage leaves, finish with lemon.
- **Over pasta:** On buttered linguine with the pan sauce.
- **Bay scallops:** One very hot batch, 60 seconds per side.
- **No fig vinegar:** Dry white wine or white wine vinegar.

## Troubleshooting

| Problem | Fix |
|---|---|
| Pale, no crust | Wet scallops, pan not hot, or crowded |
| Stick to the pan | Not ready to flip. Wait 15–20 seconds |
| Rubbery | Pull at 115°F, not 125°F |
| Milky liquid in the pan | Wet scallops. Use the rescue soak |
| Butter burned | Added before the flip, or heat too high |
| Sauce broke | Pan too hot. Off heat, cold butter, one cube at a time |
| Tough strip on the side | Side muscle wasn't removed |

## Salt, Fat, Acid, Heat Tips

- **Dryness is half the sear.**
- **Use two fats.** Oil for heat, butter for flavor.
- **Pull early.** Delicate food finishes cooking off the heat.
- **Enrich a sauce with cold butter, off the heat.**

## Notes for the Kids

- Ask for "dry" scallops. If they're white and sitting in milk, they're wet.
- Peel off the little side muscle.
- Dry them. Wait 10 minutes. Dry them again.
- Don't move them. They let go when they're ready.
- Two batches, not one crowded pan.

# Crispy-Skin Pan-Seared Salmon
### Cast iron, slow render, probe-timed, with a blood orange and fig drizzle

Adapted from the technique in a Food52 crispy-skin salmon recipe: moderate-high preheat, then medium-low to render the skin slowly. Salting, probe temps and the drizzle are our own additions.

**Serves:** 4 | **Active:** 20 min | **Total:** 40 min (includes 15 min salting) | **Equipment:** 12-inch cast iron or heavy stainless skillet, thin flexible fish spatula, CHEF iQ probe or instant-read, paper towels

## Ingredients

**Salmon**
- 4 skin-on salmon fillets, about 6 oz each (1½ lb total), similar thickness. Center cuts are best
- 1½ tsp Morton kosher salt (1% of weight)
- Black pepper

**Pan**
- 1–2 Tbsp neutral high-smoke-point oil (avocado works)

**Drizzle (3 : 1 oil to vinegar)**
- 3 Tbsp blood orange oil
- 1 Tbsp fig vinegar
- Pinch of flake salt

**To serve**
- Lemon wedges
- Flake salt
- Rice, greens, or Chilled Lemon Asparagus

## Steps

1. **Dry the skin completely.** Pat fillets with paper towels, skin side especially. If you have time, set them skin side up on a rack in the fridge, uncovered, for 30 minutes to an hour. **Dry skin crisps. Wet skin steams.**
2. **Salt.** Sprinkle the flesh side with salt and pepper and salt the skin lightly. Let sit **15 minutes at room temperature.** Any longer and the salt starts to cure the flesh and pull out moisture. Pat the skin dry again.
3. **Drizzle.** Whisk the oil, vinegar and a pinch of flake salt. Set aside.
4. **Preheat.** Cast iron over **medium-high for about 3 minutes.** Add the oil. A drop of water should bead up and skate across the surface.
5. **Skin side down.** Lay each fillet in away from you so the oil splashes away from your hand. **Press down with a flexible spatula for 10–15 seconds.** Salmon skin shrinks and curls on contact, and pressing keeps full skin contact with the pan.
6. **Drop the heat to medium-low.** If the skin starts to scorch, lower it more. Gentle heat renders the fat under the skin slowly, drying and browning it without burning.
7. **Wait.** Cook **10–15 minutes,** untouched. Check the edges after about 5 minutes. When the skin is deep golden, crisp and **releases from the pan without sticking,** it's ready. A fillet that resists isn't done on that side yet.
8. **Watch the climb.** The flesh turns opaque from the bottom. When it's about ⅔ opaque up the side, the probe should be near 110°F.
9. **Flip and finish.** Turn each fillet and cook the flesh side **about 1–2 minutes.** Pull at **120–125°F** in the thickest part for tender medium, since it climbs about 5°F as it rests. Pull at 130°F for firmer.
10. **Rest and serve.** Rest 2 minutes **skin side up** on a rack or plate. Not skin down on a plate, where steam softens it. Spoon the drizzle on the flesh side only, not the skin. Flake salt on top and lemon on the side.

## Pair With

- Chilled Lemon Asparagus
- Plain rice (method in Ground Beef Bulgogi Rice Bowls)
- Hot-Pan Blistered Green Beans
- Chilled Lentils with Shallot Vinaigrette
- Pickled Beet & Burrata Salad

## Why This Works (Five Pillars)

**Salt.** Salmon is rich enough to carry real seasoning. A 1% salting for 15 minutes seasons the flesh without curing it, and dry skin crisps better than damp skin.

**Fat.** Salmon skin sits on a layer of fat. Medium-low heat melts it out slowly, and the fillet effectively fries in its own rendered fat. The skin turns into a thin, crisp cracker. Oil in the pan prevents sticking while the fat renders.

**Acid.** Salmon is oily and needs a sharp counterpoint. Lemon at the table and fig vinegar in the drizzle cut right through. Acid goes on at the end, so it doesn't dull the crisp skin.

**Sweet.** Blood orange oil and fig vinegar bring fruity sweetness that suits rich fish.

**Umami.** Cooked salmon is naturally savory. Browned skin adds a toasty, almost bacon-like note.

**Heat (temperature).** Start hot enough to sear, then back off so the skin dries and crisps instead of burning before the fat renders. Cooking mostly on the skin side protects the flesh from overcooking. The probe ends the cook at the right moment, at 120–125°F.

## Variants

- **Oven finish for thick fillets:** Sear the skin side 5–6 minutes, then move the pan to a 400°F oven until the probe hits 120°F.
- **Kinder's blends:** Lemon Butter Garlic or Lemon & Herb (see Baked Cod) both suit salmon. They carry their own salt, so skip the added salt and sprinkle on the flesh side only.
- **Hot honey vinegar glaze:** Brush the flesh side in the last 30 seconds, off high heat.
- **Skin-chips bonus:** Crisp leftover skin trimmings in the pan for a salad topper.
- **Next to the smoked salmon:** Keep this one for weeknights and use the hot-smoked salmon for weekends when it's added.

## Troubleshooting

| Problem | Fix |
|---|---|
| Skin stuck to the pan | Not ready to flip. Give it another minute or two, and it will release on its own |
| Skin rubbery, not crisp | Skin was wet, heat was too low, or not enough time. Dry better and cook longer on the skin side |
| Skin burned, flesh raw | Heat stayed too high. Drop to medium-low right after the fillet goes in |
| Fillet curled up | Skipped the press. Hold it flat with a spatula for the first 10–15 seconds |
| Dry, chalky salmon | Overcooked. Pull at 120–125°F |
| White protein ooze on top | Albumin pushed out by fast cooking. Normal and harmless, but gentler heat reduces it |
| Smoky kitchen | Oil too hot, or an olive oil with a low smoke point. Use avocado oil |

## Salt, Fat, Acid, Heat Tips

- **Start hot, finish gentle.** Use high heat to get the pan ready and low heat to cook through. A pan that stays blazing burns skin before the fat renders.
- **Give the skin its own space.** Anything wet, crowded or covered turns crisp to soggy. Dry fish, a dry skin surface, and no lid.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Dry the skin. Then dry it again.
- Once the fish is in the pan, leave it alone. It will let go when it's ready.
- Skin side up when it rests, so the skin stays crisp.
- 120–125°F, then rest. Don't cook salmon to dry.
- Same thick-center-cut rule as the cod. Thin tail pieces overcook fast.

# No-Mayo Tuna Salads — Three Ways
### Oil-and-vinegar tuna salads for topping greens

**Each recipe:** ~2 cups, tops 3–4 salads | **Active:** 15 min | **Rest:** 15 min (better overnight) | **Keeps:** 3 days refrigerated
**Equipment:** Mixing bowl, fork, small jar for dressing

## The Base Method (all three)

### Base ratio
- **Tuna:** 2 cans (5 oz each), drained
- **Dressing:** 4 Tbsp oil : 1 Tbsp vinegar + 1 tsp Dijon — the book's 3:1 fat-to-acid, plus 1 Tbsp oil to replace the fat water-packed tuna lacks
- **Crunch:** ~1 cup chopped vegetables
- **Salt:** Start with ¼ tsp. Canned tuna is already salted — taste before adding more.

### Tuna choice
Water-packed solid white albacore. Drain well, then press gently in a paper towel — leftover water dilutes the dressing. Oil-packed also works; drop the oil back to 3 Tbsp.

### Steps
1. **Dressing first.** Shake oil, vinegar, Dijon, salt, and pepper in a jar until creamy. Dijon is the emulsifier — it holds the oil and vinegar together and does the binding job mayo used to.
2. **Marinate the crunch.** Toss onions and vegetables with half the dressing. Sit 10 minutes. The vinegar softens raw onion bite and seasons the vegetables from the inside.
3. **Fold in tuna.** Drain tuna well. Add in large flakes and fold gently — don't mash. Big flakes look better on a salad and stay moist.
4. **Finish.** Add remaining dressing, herbs, and any delicate add-ins. Taste for salt and acid.
5. **Rest.** 15 minutes minimum; overnight is better. Stir before serving — oil settles.

### To serve as a salad topper
Make a double batch of that recipe's dressing. Use the extra to lightly dress the greens, then pile the tuna on top. Everything tastes connected.

## 1. Lemon-Caper Mediterranean
*Bright, briny, classic*

**Dressing**
- 4 Tbsp lemon oil
- 1 Tbsp sweet onion white vinegar
- 1 tsp Dijon
- ¼ tsp kosher salt, ¼ tsp black pepper

**Salad**
- 2 cans (5 oz each) tuna, drained
- 1 stalk celery, finely diced
- ¼ small red onion, finely diced
- ¼ cup Kalamata olives, chopped
- 2 Tbsp capers, rinsed and roughly chopped
- ⅓ cup flat-leaf parsley, chopped
- Zest of ½ lemon
- Optional: ½ can cannellini beans (about ¾ cup), rinsed, for a more filling salad

Best over: arugula, romaine, or butter lettuce with cucumber and cherry tomatoes.

## 2. Chipotle-Hot Honey Southwest
*Smoky, sweet heat*

**Dressing**
- 4 Tbsp chipotle oil
- 1 Tbsp hot honey vinegar
- 1 tsp Dijon
- ¼ tsp kosher salt, ¼ tsp ground cumin

**Salad**
- 2 cans (5 oz each) tuna, drained
- ½ cup corn, thawed frozen or charred fresh
- ½ can black beans (about ¾ cup), rinsed
- ½ small red bell pepper, finely diced
- 1 jalapeño, seeded, minced
- ¼ cup [Quick-Pickled Red Onions](#r/quick-pickled-red-onions), chopped
- ⅓ cup cilantro, chopped
- Squeeze of lime to finish

Best over: chopped romaine with avocado, queso fresco, and crushed tortilla chips.

## 3. Black Garlic-Sesame
*Deep, savory, umami-forward*

**Dressing**
- 4 Tbsp black garlic oil
- 1 Tbsp apple vinegar
- 1 tsp Dijon
- 1 tsp soy sauce — replaces the salt
- 1 tsp toasted sesame oil
- ½ tsp grated fresh ginger

**Salad**
- 2 cans (5 oz each) tuna, drained
- ½ English cucumber, seeded, diced
- ½ cup shelled edamame, thawed
- 3 scallions, thin-sliced
- 1 Tbsp toasted sesame seeds
- Optional: 1 Tbsp chopped pickled ginger

Best over: shredded napa cabbage and greens with shredded carrot and a sprinkle of furikake or crushed nori.

## Why This Works (Five Pillars)

**Salt.** Canned tuna arrives salted, so these start light — ¼ tsp or a teaspoon of soy. Capers, olives, and soy add salt with flavor, not just salinity.

**Fat.** Flavored oil replaces mayo as both fat and flavor carrier. Water-packed tuna is lean, so the extra tablespoon of oil makes up the difference. Dijon emulsifies the oil so it coats the tuna instead of pooling.

**Acid.** The 3:1 oil-to-vinegar ratio keeps it rich enough to bind but bright enough to cut the fish. Marinating the vegetables in vinegar first seasons them and tames raw onion.

**Sweet.** Sweet onion and hot honey vinegars carry gentle sweetness that balances briny and spicy elements. Corn and red pepper add natural sweetness in the Southwest version.

**Umami.** Tuna is naturally high in umami. Each version stacks more: olives and capers (#1), smoky chipotle (#2), black garlic and soy — a glutamate double-hit (#3).

## Variants

- **Any oil + vinegar pair works.** Keep the 3:1 ratio and 1 tsp Dijon. Use the Vinaigrette Pairing reference to pick partners.
- **Protein swap:** Same recipes with canned salmon, chicken, or white beans (vegetarian).
- **Lettuce wraps or toast:** Spoon into butter lettuce cups, or onto toasted sourdough.
- **Hard-boiled egg:** Add 1–2 chopped eggs to any version for extra richness.

## Troubleshooting

| Problem | Fix |
|---|---|
| Dry or crumbly | Add oil 1 tsp at a time |
| Oily, pooling at bottom | Not emulsified. Re-shake dressing with a little more Dijon; drain tuna better next time |
| Flat or fishy | Needs acid. Add vinegar or lemon ½ tsp at a time |
| Too salty | Rinse capers/olives next time; add more vegetables or beans |
| Watery after a day | Cucumber released water. Add cucumber the day you eat it |

## Salt, Fat, Acid, Heat Tips

- **Emulsions hold fat and acid together.** Oil and vinegar don't want to mix; mustard helps keep them combined so every bite gets both.
- **Taste, adjust, taste again.** When something tastes flat, ask first: does it need salt, or does it need acid?

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Drain the tuna really well — water in the can dilutes everything.
- Fold, don't mash. Big flakes make it look and taste better.
- It's better the next day. Make it Sunday, eat it all week.
- Once you know 3 oil : 1 vinegar : 1 tsp Dijon, you can make your own version from whatever's in the pantry.

# Bean & Lentil Salad Toppers
### Three-bean salad and chilled lentils, both vinaigrette-dressed

**Each recipe:** ~4–5 cups, tops 6–8 salads | **Keeps:** 5 days refrigerated (better on day 2)
**Equipment:** Mixing bowl, jar for vinaigrette, strainer. Lentils: medium pot or pressure cooker

## Shared Method

Same core as the No-Mayo Tuna Salads:
- **Vinaigrette:** 3 parts oil : 1 part vinegar + Dijon to hold it together.
- **Onions marinate first.** Sliced onion or shallot sits in the vinegar 10 minutes before anything else goes in. It softens the raw bite and turns them faintly pink and sweet.
- **Dress warm.** Warm beans and lentils absorb dressing; cold ones just get coated. Toss while warm, then chill.
- **Herbs and crunchy add-ins last**, right before serving.

## 1. Red, Black & White Bean Salad
*Bright, tangy, hearty*

### Vinaigrette
- ¼ cup cilantro garlic oil — or extra-virgin olive oil
- 4 tsp apple vinegar — or red wine vinegar
- 1 tsp Dijon
- ½ tsp honey
- ½ tsp kosher salt
- ¼ tsp black pepper
- ¼ tsp ground cumin

**Alternate pairing:** Spicy EVOO + sweet onion white vinegar — sweet heat. Same amounts.

### Salad
- 1 can (15 oz) red kidney beans
- 1 can (15 oz) black beans
- 1 can (15 oz) cannellini or great northern beans
- ½ medium red onion, finely diced
- 1 small red bell pepper, diced
- 1 celery stalk, diced
- ½ cup fresh parsley or cilantro, chopped

### Steps
1. **Vinaigrette.** Shake everything in a jar until creamy.
2. **Marinate the onion.** Toss red onion with half the vinaigrette. Sit 10 minutes.
3. **Rinse and warm the beans.** Drain and rinse all three cans well in a strainer — the canning liquid is starchy and dulls the dressing. Microwave 1 minute (or rinse under hot tap water) so they're just warm.
4. **Toss.** Add warm beans, bell pepper, and celery to the onions. Pour over the remaining vinaigrette. Fold gently so the beans don't break.
5. **Chill.** 1 hour minimum, overnight is best. Stir in herbs before serving. Taste — chilled food needs more salt and acid than warm.

**Best over:** Chopped romaine with avocado, tomatoes, and crumbled queso fresco.

## 2. Chilled Lentils with Shallot Vinaigrette
*Earthy, nutty, Dijon-sharp*

### Lentils
- 1 cup French green (du Puy) or black beluga lentils, rinsed and picked over
- 4 cups water
- 1 tsp kosher salt
- 1 bay leaf
- 1 garlic clove, smashed

### Vinaigrette
- ¼ cup rosemary oil — or extra-virgin olive oil
- 4 tsp fig vinegar — or sherry or red wine vinegar
- 2 tsp Dijon
- 2 shallots, finely minced
- ½ tsp kosher salt
- ¼ tsp black pepper

**Alternate pairing:** Blood orange oil + cinnamon pear vinegar — warm, fall-flavored. Same amounts. Great with walnuts and dried cranberries from the add-in table.

### Steps
1. **Cook the lentils.**
   - **Stovetop:** Lentils, water, salt, bay, and garlic in a pot. Simmer gently (don't boil hard — they burst) **18–25 minutes** until tender but holding their shape. Start tasting at 18.
   - **Pressure cooker:** Same ingredients, high pressure **7 minutes**, quick release.
2. **Shallots marinate.** While lentils cook, whisk vinegar, Dijon, salt, pepper, and shallots. Let sit. Whisk in oil just before using.
3. **Drain and dress warm.** Drain lentils well, discard bay and garlic. Toss immediately with the vinaigrette.
4. **Add-ins.** Cool 10 minutes, then fold in your add-ins (below).
5. **Chill.** 1 hour minimum. Re-taste and adjust salt and vinegar before serving.

|---|---|---|

| Celery, finely diced | 1 stalk | Fresh crunch |
| Fresh parsley, chopped | ½ cup | Bright, grassy |
| Fresh mint or dill | ¼ cup | Cool lift |
| Toasted walnuts | ½ cup | Rich crunch (add at serving) |
| Goat cheese or feta, crumbled | ½ cup | Creamy, salty (add at serving) |
| Roasted red peppers, diced | ½ cup | Sweet, smoky |
| Cherry tomatoes, halved | 1 cup | Juicy acid |
| Sun-dried tomatoes, chopped | ¼ cup | Concentrated umami |
| Dried cranberries or chopped figs | ¼ cup | Chewy sweetness — great with fig vinegar |
| Baby spinach or arugula | 2 cups | Folds in to make it a full salad |

**Classic combo:** Carrot + celery + parsley + goat cheese.
**From the book's pantry:** Walnuts + goat cheese + chopped figs, with the fig vinegar.

**Best over:** Arugula or mixed greens with a soft-boiled egg.

## Why This Works (Five Pillars)

**Salt.** Lentils are salted in the cooking water so they're seasoned all the way through. Canned beans are already salted, so the dressing goes light. Cold dulls salt — always re-taste after chilling.

**Fat.** The 3:1 oil-to-vinegar ratio coats without being greasy. Flavored oils (cilantro garlic, rosemary) do double duty: fat and flavor.

- **Grain bowl:** Spoon either salad over warm farro or quinoa.

## Troubleshooting

| Problem | Fix |
|---|---|
| Lentils mushy | Boiled too hard or overcooked. Gentle simmer; start tasting at 18 min. Use green or black lentils, never red |
| Lentils still hard | Old lentils. Keep simmering, 5 min at a time |
| Bland after chilling | Cold mutes flavor. Add salt and a splash of vinegar before serving |
| Beans taste "canned" | Rinse more thoroughly |
| Onion too sharp | Marinate longer, or rinse diced onion in cold water before marinating |
| Dressing separated | Re-shake with a little more Dijon |

## Salt, Fat, Acid, Heat Tips

- **Salt beans and lentils while they cook.** The old idea that salt keeps legumes hard isn't true — salted cooking water seasons them all the way through.
- **Dress starches warm.** Warm beans, lentils, potatoes, and grains absorb dressing; cold ones only get coated.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Rinse canned beans. Always.
- Dress beans and lentils while they're warm.
- Taste it cold before you serve it. It always needs a little more salt and vinegar than you think.
- Red lentils turn to mush — they're for soup, not salad.
- Make on Sunday, top salads all week.

# Hot-Pan Blistered Green Beans
### Kinder's butter seasoning, garlic finish, optional shallots

**Serves:** 4 | **Active:** 15 min | **Total:** 15 min (20 with pre-blanch)
**Equipment:** 12-inch cast iron, tongs. For pre-blanch: large pot, bowl of ice water, towels

## Ingredients

- 1 lb green beans, trimmed
- 3 Tbsp neutral high-smoke-point oil, added in waves
- 2 shallots, thin-sliced — optional
- 1½–2 tsp Kinder's seasoning, either flavor (salt is already in both — no added salt):
  - **Caramelized Onion Butter** — sweeter, toasty onion
  - **Roasted Garlic Brown Butter** — nutty, garlicky
- 3 garlic cloves, thin-sliced
- Optional: lemon wedge to finish

## Steps

1. **No extra salt.** Sea salt is the first ingredient in both Kinder's flavors, so either seasons the beans on its own. With Roasted Garlic Brown Butter, you can cut the fresh garlic to 2 cloves. Start with 1½ tsp and taste at the end.
2. **Dry the beans.** Completely dry. Water steams instead of blisters.
3. **Heat hard.** Cast iron over high until it just starts to smoke.
4. **Wave 1.** 1 Tbsp oil, then beans in a single layer. **Don't touch for 2–3 minutes** until blistered and charred in spots.
5. **Wave 2.** Toss. When the pan looks dry, drizzle another 1 Tbsp oil around the edges, not on the beans. Add shallots now if using. Cook 2–3 minutes, tossing occasionally.
6. **Wave 3.** Last 1 Tbsp oil as the pan dries again. Sprinkle in the seasoning. Toss 1–2 minutes until beans are crisp-tender.
7. **Garlic last.** Drop heat to medium. Add garlic, toss 30–60 seconds until golden and fragrant. Off heat immediately.
8. **Finish.** Taste. Optional squeeze of lemon. Serve right away.

### Option: Pre-blanch
For more tender beans or a big batch, blanch ahead:
1. Boil a large pot of well-salted water. Beans in for **2 minutes**.
2. Straight into ice water, 2 minutes.
3. Drain and dry **very** thoroughly on towels. Can be done up to 2 days ahead, refrigerated.
4. Hot-pan time drops to 4–5 minutes total.

## Why This Works (Five Pillars)

**Salt.** The Kinder's blend carries the salt. It goes on late so the beans don't release water early — and because its onion bits and sugar scorch on long, high heat.

**Fat.** Oil in waves keeps a thin, hot film in the pan the whole time. Dump it all in at once and the beans fry greasy; too little and they scorch. Each wave goes in when the pan looks dry.

**Acid.** A squeeze of lemon at the end brightens the char and the richness of the brown butter flavor.

**Sweet.** High heat caramelizes the beans' natural sugars into blistered, sweet spots. Shallots add a mellow sweetness.

**Umami.** Charred edges (Maillard browning) and the toasty brown butter and onion seasoning give savory depth.

**Heat (temperature).** Ripping-hot cast iron blisters the skin before the inside goes soft. Garlic burns in seconds at that heat, so it goes in last on lower heat.

## Troubleshooting

| Problem | Fix |
|---|---|
| Beans steamed, no char | Wet beans or pan not hot. Dry better; let it smoke first |
| Seasoning burned | Added too early. Last 1–2 minutes only |
| Garlic bitter | Pan too hot. Lower heat before adding |
| Greasy | Too much oil at once. Add in waves, only when the pan looks dry |
| Still squeaky/raw | Pre-blanch next time, or cover 1 minute with a splash of water |

## Salt, Fat, Acid, Heat Tips

- **Aromatics go in by burn time.** Garlic burns fastest, so it goes in last. Shallots can take more heat, so they go in earlier.
- **Blanching water should taste seasoned.** If you pre-blanch, salt the water well — vegetables absorb seasoning while they cook, not after.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Dry beans blister. Wet beans steam.
- Oil goes in when the pan asks for it — when it looks dry.
- Garlic is always last. It burns faster than anything.

# Chilled Lemon Asparagus
### Blanched and chilled, with olive oil, lemon, salt & pepper — optional bacon aioli

**Serves:** 4 | **Active:** 15 min | **Total:** 20 min (aioli +15 min)
**Equipment:** Large pot, large bowl of ice water, towels, skillet (for bacon)

## Ingredients

**Asparagus**
- 1 lb asparagus
- 4 qt water + 2 Tbsp Morton kosher salt — about 1% salted water
- Large bowl of ice water

**Dressing**
- 2 Tbsp good extra-virgin olive oil
- Zest of ½ lemon + 1 Tbsp juice
- Flake salt
- Fresh-cracked black pepper

**Optional bacon aioli** (from scratch)
- 4 slices bacon
- 1 large egg yolk, room temperature (pasteurized if serving kids, elders, or anyone pregnant)
- 1 small garlic clove, grated
- 2 tsp lemon juice
- 1 tsp Dijon
- ¼ tsp kosher salt
- ½ cup neutral oil
- 2 Tbsp reserved bacon fat, cooled but liquid
- Pinch of smoked paprika
- ¼ tsp black pepper

## Steps

### Asparagus
1. **Trim.** Hold a spear at each end and bend — it snaps where the woody part ends. Use it as a guide and cut the rest to match.
2. **Boil.** Bring the salted water to a rolling boil.
3. **Blanch by thickness.**
   - Pencil-thin: 1–1½ minutes
   - Medium: 2–2½ minutes
   - Thick: 3–4 minutes
   Done when bright green and a knife meets slight resistance.
4. **Shock.** Straight into the ice water, 3 minutes. This stops the cooking and locks in the color.
5. **Dry.** Spread on towels and pat dry. Refrigerate until serving (up to 1 day ahead).
6. **Dress just before serving.** Arrange on a platter. Drizzle olive oil, scatter zest, squeeze lemon juice over, finish with flake salt and pepper.

### Optional bacon aioli
1. **Bacon.** Cook in a skillet over medium until crisp, 8–10 minutes. Drain on paper towels. Pour off and reserve 2 Tbsp fat; let it cool until just warm. Combine with the neutral oil in a measuring cup with a spout.
2. **Base.** In a bowl set on a damp towel (keeps it from spinning), whisk yolk, garlic, lemon juice, Dijon, and salt.
3. **Emulsify.** Whisking constantly, add the oil mixture **drop by drop** for the first quarter. Once it thickens and turns pale, pour in a thin, steady stream. Takes 3–4 minutes by hand (or use an immersion blender in a tall cup — 30 seconds).
4. **Season.** Whisk in smoked paprika and pepper. Taste for salt and lemon. Thin with a teaspoon of water if too stiff.
5. **Bacon in.** Finely chop the bacon. Stir half in; save half for the top.
6. Serve on the side, or spoon across the asparagus and finish with the reserved bacon. Keeps 3 days refrigerated.

**Option — mayo shortcut:** Skip steps 2–3. Whisk ½ cup mayonnaise with the garlic, 1 tsp lemon juice, Dijon, paprika, pepper, and only 1 Tbsp bacon fat. Then step 5.

## Why This Works (Five Pillars)

**Salt.** 1% salted water seasons the asparagus from the inside while it cooks. Flake salt on top adds crunch and a final hit.

**Fat.** Good olive oil is a flavor here, not just a fat — use the nice bottle. The aioli brings smoky, rich fat that contrasts with the clean asparagus.

**Acid.** Lemon goes on at the last minute. Acid left sitting on green vegetables turns them drab olive-brown.

**Sweet.** Fresh asparagus has natural sweetness that blanching keeps intact.

**Umami.** Bacon is the umami bomb — cured, smoked, and browned.

**Heat (temperature).** A short, hard boil cooks the spears evenly; the ice bath stops it instantly. That's how you get crisp-tender and bright green instead of limp and gray.

## Variants

- **Warm:** Skip the ice bath; dress hot.
- **Grilled:** Toss raw spears in oil and salt; charcoal grill over high direct heat 3–5 minutes, turning.
- **Toppings:** Shaved Parmesan, chopped hard-boiled egg, or toasted almonds.
- **Pantry oils:** Lemon oil in place of olive oil for extra brightness.

## Troubleshooting

| Problem | Fix |
|---|---|
| Asparagus limp or gray | Overcooked or not shocked fast enough. Time by thickness; have ice ready |
| Turned olive-brown | Lemon added too early. Dress just before serving |
| Aioli broke/greasy | Oil added too fast or bacon fat too hot. Start a fresh yolk in a clean bowl and slowly whisk the broken aioli into it |
| Aioli too thick | Whisk in water a teaspoon at a time |
| Woody bites | Trim more — snap test every few spears |

## Salt, Fat, Acid, Heat Tips

- **Acid dulls green.** Acid turns bright green vegetables olive-brown over time. Dress green vegetables at the last moment.
- **Season the water, season the vegetable.** Salted cooking water seasons from the inside out; salt sprinkled on top only seasons the outside.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Have the ice bath ready before anything goes in the pot.
- Thin spears cook fast. Watch the clock.
- Lemon goes on last, right before it hits the table.

# Pickled Beet & Burrata Salad
### Tangy pickled beets, creamy burrata, fresh herbs

**Serves:** 4 | **Active:** 25 min | **Total:** 2 hrs minimum (best pickled overnight) | **Pickled beets keep:** 2 weeks
**Equipment:** Pressure cooker (or oven), quart jar, gloves (beets stain), small saucepan

## Ingredients

**Pickled beets**
- 4 medium beets (about 1⅓ lb), scrubbed, greens trimmed to 1 inch
- 1 cup red wine vinegar or apple cider vinegar
- ½ cup water
- ¼ cup sugar
- 1¼ tsp Morton kosher salt
- Optional aromatics: 1 bay leaf, ½ tsp black peppercorns, 2 strips orange peel

**Salad**
- 2 balls burrata (8 oz total)
- 2 cups arugula (optional bed)
- Fresh herbs, ~½ cup total, leaves torn: mint, basil, dill, chives — any mix
- ¼ cup pistachios, toasted and roughly chopped — optional

**Dressing**
- 3 Tbsp extra-virgin olive oil
- 1 Tbsp beet pickling brine
- Flake salt
- Fresh-cracked black pepper
- Honey drizzle — optional

## Steps

### Cook the beets
- **Pressure cooker (preferred):** Trivet + 1 cup water. Beets on the trivet. High pressure **18 minutes** (small), **22** (medium), **28** (large). Natural release 10 minutes.
- **Oven:** Wrap each in foil, 400°F, 45–60 minutes until a knife slides in easily.

Cool until you can handle them. Wearing gloves, rub the skins off with a paper towel.

### Pickle
1. Cut beets into wedges or ½-inch slices. Pack into a quart jar.
2. Bring vinegar, water, sugar, salt, and aromatics to a boil, stirring to dissolve.
3. Pour hot over the beets. Cool to room temp, lid, refrigerate. **2 hours minimum; overnight is best.**

### Build the salad
1. **Burrata out early.** 30 minutes at room temperature — cold burrata tastes like nothing.
2. **Dressing.** Whisk olive oil and pickling brine (the book's 3:1 ratio).
3. **Plate.** Arugula on a platter if using. Beets on top. Tear the burrata open and nestle the pieces among the beets so the creamy center spills out.
4. **Finish.** Spoon dressing over everything. Scatter herbs and pistachios. Flake salt, pepper, and an optional thin honey drizzle.

## Why This Works (Five Pillars)

**Salt.** Salt in the brine seasons the beets all the way through. Flake salt on the burrata wakes up its mild milkiness.

**Fat.** Burrata's cream center is the rich counterpoint to sharp beets. Olive oil carries the herb aromas.

**Acid.** Pickled beets bring the acid, and the brine doubles as the vinegar in the dressing — nothing wasted, and everything tastes connected.

**Sweet.** Beets are naturally sweet; a little sugar in the brine balances the vinegar. Honey on top is optional, for a sweet-tangy finish.

**Umami.** The quietest pillar here — toasted pistachios add a savory, nutty depth.

**Fresh herbs.** Mint and basil add a cool, bright lift; dill adds a grassy tang that's classic with beets.

## Variants

- **From the pantry:** Swap the dressing for blood orange oil + fig vinegar (3:1).
- **Golden beets:** Pickle separately so the red doesn't bleed onto them.
- **Cheese swap:** Fresh mozzarella, goat cheese, or whipped feta.
- **Citrus:** Add orange or blood orange segments.

## Troubleshooting

| Problem | Fix |
|---|---|
| Beets too sharp | Pickled too briefly or too much vinegar. Add a bit more sugar to the brine next time |
| Burrata bland | Too cold. Let it come to room temp; more flake salt |
| Herbs wilted/black | Added too early. Tear and add right before serving |
| Pink everything | Plate the beets last; tear burrata on top, not underneath |

## Salt, Fat, Acid, Heat Tips

- **Cold food needs more seasoning.** Chilling mutes flavor. Always taste cold dishes cold, then adjust salt and acid.
- **Use acid that's already there.** The pickling brine is a seasoned vinegar — reusing it ties the dish together.

*Principles from Samin Nosrat's* Salt, Fat, Acid, Heat, *in our own words.*

## Notes for the Kids

- Fresh beets only. Canned beets are soft and taste like the can.
- Wear gloves for beets — they stain hands and cutting boards. Lemon juice helps if you forget.
- Pickle the beets the day before. The salad takes 5 minutes after that.
- Never throw out the pickling brine. It's your vinegar for the dressing.

# Seared Brussels Sprouts with Fish Sauce Vinaigrette
### Cast-iron seared, oven-finished, tossed in a sweet-salty-sour-spicy dressing with mint & cilantro

**Serves:** 4–6 | **Active:** 25 min | **Total:** 45–55 min | **Dressing keeps:** 1 week
**Equipment:** 12-inch cast iron, sheet pan, tongs, small jar
**Inspired by:** Momofuku's roasted Brussels sprouts with fish sauce vinaigrette, rebuilt around the book's pillars

## Ingredients

**Vinaigrette**

- 2 Tbsp fish sauce
- 2 Tbsp water
- 2 Tbsp rice vinegar
- 1 Tbsp lime juice
- 2 tsp sugar
- 1 garlic clove, finely grated
- 1–2 Thai chiles, thin-sliced (or ½ tsp red pepper flakes)

**Sprouts**

- 1½ lb Brussels sprouts, trimmed and halved through the stem
- 3 Tbsp avocado oil, divided
- No added salt — fish sauce is the salt

**To finish**

- ¼ cup fresh mint, torn
- ¼ cup cilantro, chopped
- Optional: crushed roasted peanuts or crispy shallots; lime wedge

## Steps

1. **Dressing.** Shake everything until the sugar dissolves. Taste on a raw sprout leaf: very salty, very sour, faintly sweet.
2. **Prep.** Sprouts completely dry. Halve through the stem. Oven to **400°F**.
3. **Sear.** Cast iron over medium-high, 1½ Tbsp oil. Sprouts **cut side down**, tight single layer. **Don't touch for 4–5 minutes** until deep, dark brown.
4. **Oven.** Slide the skillet in. **10–15 minutes** until a knife slips into the stem end.
5. **Dress hot.** Toss with **¾ of the dressing**, then herbs. Taste, add more dressing or lime. Top with peanuts or shallots.

## Pair With

- Butter-Basted Seared Scallops
- Smoked Pork Ribs or Grilled Chicken Thighs
- Ground Beef Bulgogi Rice Bowls

## Why This Works (Five Pillars)

**Salt.** Fish sauce is liquid salt with extra flavor, added after cooking so it doesn't pull water early.

**Fat.** A hot film of oil browns the cut face.

**Acid.** Rice vinegar and lime cut the char and stay bright because they go on after.

**Sweet.** Searing caramelizes the sprouts' sugars; a little sugar in the dressing tames bitterness.

**Umami.** Fish sauce is fermented anchovy, packed with glutamate.

**Heat (temperature).** Sear for color, oven to cook the center.

## Variants

- **Sheet pan for a crowd:** 450°F, cut side down on a preheated pan, 20–25 minutes.
- **Vegetarian:** 2 Tbsp soy sauce + 1 tsp miso instead of fish sauce.
- **Other vegetables:** Great on charred broccoli, cabbage, or green beans.

## Troubleshooting

| Problem | Fix |
|---|---|
| Pale | Pan not hot, sprouts wet, or crowded |
| Burnt outside, hard center | Give the oven the full time |
| Too salty | Thin dressing with water and lime |
| Too fishy | More lime and a pinch of sugar |

## Notes for the Kids

- Sear them until they're almost burnt.
- Dry them. Cut side down. Don't touch them.
- The dressing smells strong. Trust it.
- Taste the sauce before you pour it all on.

# Ninja Creami Protein Ice Cream, Two Flavors
### Peanut Butter Protein and Orange Lemon — one tested base, 24 oz tub

**Makes:** 1 tub (24 oz Creami) | **Active:** 5 min | **Freeze:** 24–48 hrs
**Equipment:** 24 oz Ninja Creami, whisk

## The Base (both flavors)

- 1 Premier Protein shake (11 oz)
- ½ cup non-fat plain Greek yogurt
- 1 Tbsp sugar-free Jell-O instant pudding mix
- ¼ tsp guar gum
- 1 Tbsp monk fruit sweetener
- ⅛ tsp Morton kosher salt
- For the re-spin: 1 Tbsp heavy whipping cream

## 1. Peanut Butter Protein

- Base above, with a **vanilla or chocolate** shake and vanilla or chocolate pudding mix
- 3 Tbsp PB2 peanut butter powder

## 2. Orange Lemon

- Base above, with a **Premier Protein Orange Cream Swirl** shake (limited edition — stock up when you see it)
- **Lemon** sugar-free pudding mix

## Steps

1. **Dry first.** In the tub, whisk the pudding mix, guar gum, salt (and PB powder for flavor 1) together dry. Guar clumps if it hits liquid alone.
2. **Yogurt.** Stir in the Greek yogurt until there are no dry pockets.
3. **Shake.** Pour the shake in slowly while stirring until smooth.
4. **Sweeten.** Stir in the monk fruit. Taste and adjust.
5. **Fill line.** Top off with almond milk if you're short of the fill line.
6. **Freeze flat** with the lid on, **24–48 hours**.
7. **Spin on Lite Ice Cream** — not the regular Ice Cream program, which turns protein bases gummy.
8. **Re-spin.** Crumbly or powdery is normal for a protein base. Add 1 Tbsp heavy cream to the surface and re-spin.

## Why This Works

**Fat.** A protein shake and non-fat yogurt are lean. One tablespoon of cream at the re-spin adds just enough fat to make it feel like ice cream.

**Sweet.** Monk fruit sweetens without sugar; pudding mix adds body and flavor.

**Salt.** A pinch of salt makes the peanut taste nuttier and the citrus brighter.

**Acid.** Greek yogurt adds a little tang; in the Orange Lemon, the lemon pudding makes it bright instead of creamsicle-sweet.

**Texture.** The Creami shaves a frozen block instead of churning it. Pudding mix and guar keep ice crystals small so the shave turns creamy, not icy. Protein (casein) freezes hard, which is why a re-spin is standard.

## Troubleshooting

| Problem | Fix |
|---|---|
| Powdery or crumbly | Normal. Re-spin with 1 Tbsp heavy cream |
| Gummy | Used the full Ice Cream program, or too much guar. Use Lite Ice Cream |
| Clumps of guar | Mix the dry ingredients together before any liquid |
| Icy | Not enough stabilizer, or frozen less than 24 hours |

## Rules

- Lite Ice Cream program for protein bases.
- Expect one re-spin.
- **No banana. Ever.**

## Notes for the Kids

- Start it two days ahead. The freezer does most of the work.
- Dry ingredients first, then wet.
- If it looks like sand after the first spin, that's normal — cream and re-spin.

}

// ---- pages ----
function metaHtml(meta) {
  if (!meta) return "";
  const parts = [];
  meta.trim().split("\n").forEach(line => line.split(" | ").forEach(seg => {
    const m = seg.trim().match(/^\*\*(.+?):\*\*\s*(.*)$/);
    if (m) parts.push(`<div class="m"><span>${esc(m[1])}</span>${inline(m[2])}</div>`);
  }));
  return `<div class="meta">${parts.join("")}</div>`;
}
function withAnchors(html, prefix) {
  const div = document.createElement('div'); div.innerHTML = html;
  div.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  const heads = [...div.querySelectorAll('h2')];
  heads.forEach((h, i) => h.id = prefix + "-" + i);
  return {html: div.innerHTML, heads: heads.map((h, i) => ({id: h.id, text: h.textContent}))};
}
function homePage() {
  const cards = TOPS.map(t => `<section class="card"><h3>${esc(t.name)}</h3>${t.subs.map(s =>
    (s.name ? `<h4>${esc(s.name)}</h4>` : "") + "<ul>" + s.recipes.map(r =>
      `<li><a href="#r/${r.slug}">${esc(r.title)}</a>${r.status === "draft" ? ' <em class="badge">Draft</em>' : ''}</li>`).join("") + "</ul>").join("")}</section>`).join("");
  return `<header class="hero"><p class="eyebrow">From our kitchen to yours</p><h1>Family Recipes</h1>
    <p class="lede">Made with love, seasoned to taste, and always better shared.</p>
    <svg class="flourish" width="120" height="14" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7h44M74 7h44" stroke="currentColor" stroke-width="1.5"/><path d="M60 13s-8-4.9-8-10.8C52 0 54.5 0 56 0c2 0 3 .8 4 2 1-1.2 2-2 4-2 1.5 0 4 0 4 2.2C68 8.1 60 13 60 13z" fill="currentColor"/></svg></header>
    <div class="prose">${marked.parse(INTRO.body)}</div>
    <div class="cta-row"><a class="btn" href="#principles">Start with the Basics</a><a class="btn btn-ghost mail" href="#">Send Dad a recipe</a></div>
    <h2 class="section-h">What's Cooking</h2><div class="cards">${cards}</div>`;
}
function principlesPage() {
  const a = withAnchors(marked.parse(PRIN.body), "p");
  return `<div class="crumb">Start Here</div><h1>${esc(PRIN.title)}</h1><p class="sub">${esc(PRIN.sub)}</p>
    ${toc(a.heads)}<div class="prose">${a.html}</div>`;
}
function toc(heads) {
  if (heads.length < 4) return "";
  return `<nav class="toc no-print"><b>On this page</b>${heads.map(h => `<a href="#" data-jump="${h.id}">${esc(h.text.replace(/\s*\(.*\)$/, ""))}</a>`).join("")}</nav>`;
}
function recipePage(r) {
  const i = RECIPES.indexOf(r), prev = RECIPES[i - 1], next = RECIPES[i + 1];
  const a = withAnchors(marked.parse(r.body), "s");
  return `<div class="crumb"><a href="#home" onclick="openGroup('${esc(topOf(r)).replace(/'/g, "\\'")}')">${esc(r.chapter)}</a>${r.status === "draft" ? '<span class="badge">Draft — still testing</span>' : ''}</div>
    <h1>${esc(r.title)}</h1><p class="sub">${esc(r.sub)}</p>${metaHtml(r.meta)}
    <div class="tools no-print"><button type="button" onclick="window.print()">Print this recipe</button></div>
    ${toc(a.heads)}<div class="prose">${a.html}</div>
    ${r.draft ? `<aside class="draft-box"><h3>Draft notes</h3>${marked.parse(r.draft)}</aside>` : ""}
    <nav class="pn">${prev ? `<a href="#r/${prev.slug}">← ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a href="#r/${next.slug}">${esc(next.title)} →</a>` : "<span></span>"}</nav>`;
}

// ---- routing ----
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, "")) || "home";
  const page = document.getElementById('page');
  let r = null;
  if (h === "principles") { page.className = "page recipe"; page.innerHTML = principlesPage(); document.title = "Basic Principles · Family Recipes"; }
  else if (h.startsWith("r/") && (r = RECIPES.find(x => x.slug === h.slice(2)))) { page.className = "page recipe"; page.innerHTML = recipePage(r); document.title = r.title + " · Family Recipes"; }
  else { page.className = "page"; page.innerHTML = homePage(); document.title = "Family Recipes"; }
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('current', a.getAttribute('href') === "#" + (r ? "r/" + r.slug : h === "principles" ? "principles" : "home")));
  if (r) openGroup(topOf(r));
  wireMail();
  window.scrollTo(0, 0);
  toggleNav(false);
}
function openGroup(name) {
  document.querySelectorAll('.nav-group').forEach(d => { if (d.dataset.top === name) d.open = true; });
}
function toggleNav(force) {
  const open = typeof force === 'boolean' ? force : !document.body.classList.contains('nav-open');
  document.body.classList.toggle('nav-open', open);
}
function wireMail() { document.querySelectorAll('.mail, #mail-foot').forEach(a => a.href = MAIL); }
document.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); document.getElementById(j.dataset.jump).scrollIntoView({behavior: 'smooth'}); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleNav(false); });

// ---- search ----
const INDEX = [{slug: "principles", href: "#principles", title: "Basic Principles", chapter: "Start Here", draft: false, text: PRIN.body.toLowerCase()}]
  .concat(RECIPES.map(r => ({slug: r.slug, href: "#r/" + r.slug, title: r.title, chapter: r.chapter, draft: r.status === "draft",
    text: (r.title + " " + r.sub + " " + r.body).replace(/[#*|>`_-]+/g, " ").toLowerCase()})));
const q = document.getElementById('q'), box = document.getElementById('results');
let active = -1;
function search() {
  const terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!terms.length) { box.classList.remove('open'); box.innerHTML = ''; return; }
  const scored = INDEX.map(r => {
    let s = 0; const t = r.title.toLowerCase();
    for (const w of terms) {
      if (!r.text.includes(w) && !t.includes(w)) return null;
      if (t.includes(w)) s += 10;
      if (r.chapter.toLowerCase().includes(w)) s += 4;
      s += Math.min(r.text.split(w).length - 1, 6);
    }
    return {r, s};
  }).filter(Boolean).sort((a, b) => b.s - a.s);
  active = scored.length ? 0 : -1;
  box.innerHTML = scored.length
    ? scored.map((x, i) => `<a href="${x.r.href}" class="${i === 0 ? 'active' : ''}">${esc(x.r.title)}${x.r.draft ? ' <em class="dot">draft</em>' : ''}<small>${esc(x.r.chapter)}</small></a>`).join('')
    : '<div class="none">No recipes match. Try another word.</div>';
  box.classList.add('open');
}
q.addEventListener('input', search);
q.addEventListener('focus', search);
q.addEventListener('keydown', e => {
  const items = [...box.querySelectorAll('a')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!items.length) return;
    active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((a, i) => a.classList.toggle('active', i === active));
  } else if (e.key === 'Enter' && items[active]) { location.hash = items[active].getAttribute('href'); closeSearch(); }
  else if (e.key === 'Escape') closeSearch();
});
box.addEventListener('click', e => { if (e.target.closest('a')) closeSearch(); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.remove('open'); });
function closeSearch() { box.classList.remove('open'); q.value = ''; q.blur(); }

buildNav();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
